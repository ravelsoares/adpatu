<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/cadetes.css">
    <title>Dossiê: Águias</title>
</head>

<body>
    <nav>
        <div class="pixel-font" style="color: white;">CADETES<span style="color: var(--primary-cyan);">A</span>JATO
        </div>
        <div class="nav-links">
            <a href="/cadetes.html">INÍCIO</a>
            <a href="/esquadroes.html">ESQUADRÕES</a>
            <a href="/missoes.html">MISSÕES</a>
        </div>
    </nav>

    <div class="container">
        <header style="border-left: 5px solid var(--primary-cyan); padding-left: 20px; margin-bottom: 40px;">
            <h1 class="pixel-font" style="color: var(--primary-cyan); margin: 0;">ESQUADRÃO ÁGUIAS</h1>
            <p style="color: var(--gold);">CAPITÃO: LUCAS GABRIEL</p>
        </header>

        <h2 class="pixel-font" style="font-size: 14px;">Membros da Tripulação</h2>

        <div class="member-grid">

            <div class="card" style="border-top: 3px solid var(--gold);">
                <div class="pixel-font" style="font-size: 10px; color: var(--gold);">COMMANDER</div>
                <h3 class="pixel-font" style="font-size: 14px; margin: 5px 0;">Lucas Gabriel</h3>
                <span style="font-size: 12px; color: var(--primary-cyan);">PATENTE: CAPITÃO</span>

                <div class="mini-insignia-row">
                    <div class="badge" title="Bíblia">📖</div>
                    <div class="badge" title="Oração">🙏</div>
                    <div class="badge" title="Evangelismo">📢</div>
                    <div class="badge" title="Música">🎸</div>
                    <div class="badge" title="Honra">🛡️</div>
                </div>
            </div>

            <div class="card">
                <div class="pixel-font" style="font-size: 10px; color: var(--accent-silver);">PILOTO</div>
                <h3 class="pixel-font" style="font-size: 14px; margin: 5px 0;">Mateus Silva</h3>
                <span style="font-size: 12px; color: var(--primary-cyan);">PATENTE: CADETE 1ª CLASSE</span>

                <div class="mini-insignia-row">
                    <div class="badge" title="Bíblia">📖</div>
                    <div class="badge" title="Oração">🙏</div>
                    <div class="badge locked">?</div>
                    <div class="badge locked">?</div>
                </div>
            </div>

            <div class="card">
                <div class="pixel-font" style="font-size: 10px; color: var(--accent-silver);">CO-PILOTO</div>
                <h3 class="pixel-font" style="font-size: 14px; margin: 5px 0;">Ana Clara</h3>
                <span style="font-size: 12px; color: var(--primary-cyan);">PATENTE: CADETE 2ª CLASSE</span>

                <div class="mini-insignia-row">
                    <div class="badge" title="Bíblia">📖</div>
                    <div class="badge locked">?</div>
                    <div class="badge locked">?</div>
                </div>
            </div>

        </div>

        <div style="margin-top: 40px;">
            <a href="/esquadroes.html" style="color: var(--accent-silver); text-decoration: none; font-size: 12px;">
                < VOLTAR PARA FROTAS</a>
        </div>
    </div>
</body>

</html>
