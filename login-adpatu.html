<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Área do Secretário</title>
    <link rel="stylesheet" href="styles/login-adpatu.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <img src="images/ieadern.png" alt="Logo" class="logo">
            <h2>Área do Secretário</h2>
            <p class="subtitle">Acesso restrito</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" required>
                </div>
                <div class="input-group password-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required>
                    <span id="togglePassword" class="toggle-password">Mostrar</span>
                </div>
                <button type="submit">Entrar</button>
                <p id="errorMessage" class="error-message"></p>
            </form>
            <a href="/" class="back-link">Voltar para Home</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCjQ4sgU_EmRi-RTrzchIS60bumYC-M9QQ",
            authDomain: "umadcamp-patu.firebaseapp.com",
            projectId: "umadcamp-patu",
            storageBucket: "umadcamp-patu.firebasestorage.app",
            messagingSenderId: "1043102355965",
            appId: "1:1043102355965:web:734bcffb30d37a7d2b8994",
            measurementId: "G-S6N9R4F8Z8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            // Alterna o tipo do input
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Alterna o texto
            this.textContent = type === 'password' ? 'Mostrar' : 'Ocultar';
        });


        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = '';

            try {
                const doc = await db.collection('config').doc('credentials-adpatu').get();
                if (doc.exists && doc.data().username === username && doc.data().password === password) {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    window.location.href = '/cadastro';
                } else {
                    errorMessage.textContent = 'Usuário ou senha inválidos.';
                }
            } catch (error) {
                console.error("Erro de autenticação:", error);
                errorMessage.textContent = 'Erro ao tentar fazer login. Tente novamente.';
            }
        });
    </script>
</body>

</html>
