<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMADCAMP - Home</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="styles/agenda-adpatu.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="top-banner">
        <div class="logo">
            <img src="images/ieadern.png" alt="Logo">
            <h1>Agenda do Campo de Patu</h1>
            <h3 class="subtitle">Calendário de Atividades e Congressos</h3>
        </div>
    </div>

    <div class="container">
        <div class="main-content">
            <div id="agendaContainer" class="agenda-container">
                <!-- Eventos serão carregados aqui -->
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCjQ4sgU_EmRi-RTrzchIS60bumYC-M9QQ",
            authDomain: "umadcamp-patu.firebaseapp.com",
            projectId: "umadcamp-patu",
            storageBucket: "umadcamp-patu.firebasestorage.app",
            messagingSenderId: "1043102355965",
            appId: "1:1043102355965:web:734bcffb30d37a7d2b8994",
            measurementId: "G-S6N9R4F8Z8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function showLoading(show = true) {
            const existingOverlay = document.getElementById('loadingOverlay');
            if (existingOverlay) {
                existingOverlay.remove();
            }

            if (show) {
                const overlay = document.createElement('div');
                overlay.className = 'loading-overlay';
                overlay.id = 'loadingOverlay';
                overlay.innerHTML = `
                    <div class="loading-content">
                        <div class="loading"></div>
                        <p style="margin-top: 15px; color: #333;">Carregando agenda...</p>
                    </div>
                `;
                document.body.appendChild(overlay);
            }
        }

        function formatEventDate(startDateStr, endDateStr) {
            const startDate = new Date(startDateStr + 'T00:00:00');
            const startDay = startDate.getDate();

            if (!endDateStr || startDateStr === endDateStr) {
                return `${startDay}`;
            }

            const endDate = new Date(endDateStr + 'T00:00:00');
            const endDay = endDate.getDate();

            if (startDate.getMonth() === endDate.getMonth()) {
                return `${startDay} a ${endDay}`;
            } else {
                const startMonth = startDate.toLocaleString('pt-BR', { month: 'short' }).replace('.', '');
                const endMonth = endDate.toLocaleString('pt-BR', { month: 'short' }).replace('.', '');
                return `${startDay}/${startMonth} a<br>${endDay}/${endMonth}`;
            }
        }

        async function carregarAgenda() {
            showLoading(true);
            const container = document.getElementById('agendaContainer');
            container.innerHTML = '';

            try {
                const snapshot = await db.collection('agenda-adpatu').orderBy('dataInicio', 'asc').get();

                if (snapshot.empty) {
                    container.innerHTML = '<p class="no-events">Nenhum evento na agenda no momento.</p>';
                    return;
                }

                const eventos = [];
                snapshot.forEach(doc => {
                    eventos.push(doc.data());
                });

                // Ordena por dataInicio (ascendente)
                eventos.sort((a, b) => {
                    const aDate = new Date(a.dataInicio + 'T00:00:00');
                    const bDate = new Date(b.dataInicio + 'T00:00:00');
                    return aDate - bDate;
                });

                const eventosPorAnoMes = eventos.reduce((acc, evento) => {
                    const data = new Date(evento.dataInicio + 'T00:00:00');
                    const ano = data.getFullYear();
                    const mes = data.toLocaleString('pt-BR', { month: 'long' }).toUpperCase();
                    const chave = `${ano}-${mes}`;

                    if (!acc[chave]) {
                        acc[chave] = { ano, mes, eventos: [] };
                    }
                    acc[chave].eventos.push(evento);
                    return acc;
                }, {});

                for (const chave in eventosPorAnoMes) {
                    if (eventosPorAnoMes.hasOwnProperty(chave)) {
                        const grupo = eventosPorAnoMes[chave];
                        const monthGroup = document.createElement('div');
                        monthGroup.className = 'month-group';

                        let eventsHtml = `
                            <div class="month-title-wrapper"><h2>${grupo.mes} ${grupo.ano}</h2></div>
                        `;

                        grupo.eventos.forEach(evento => {
                            const startDate = new Date(evento.dataInicio + 'T00:00:00');
                            const endDate = evento.dataFim ? new Date(evento.dataFim + 'T00:00:00') : null;

                            // Só mostra o mês abaixo da data se o evento não atravessar para outro mês
                            const monthDisplay = (endDate && startDate.getMonth() !== endDate.getMonth())
                                ? ''
                                : startDate.toLocaleString('pt-BR', { month: 'short' }).replace('.', '');
                            const dateDisplay = formatEventDate(evento.dataInicio, evento.dataFim);

                            eventsHtml += `
                                <div class="event-card">
                                    <div class="event-date">
                                        <div class="day">${dateDisplay}</div>
                                        <div class="month">${monthDisplay}</div>
                                    </div>
                                    <div class="event-details">
                                        <h3>${evento.titulo}</h3>
                                        <p><strong>Local:</strong> ${evento.local}</p>
                                    </div>
                                </div>
                            `;
                        });

                        monthGroup.innerHTML = eventsHtml;
                        container.appendChild(monthGroup);
                    }
                }

            } catch (error) {
                console.error("Erro ao carregar agenda: ", error);
                container.innerHTML = '<p class="no-events">Ocorreu um erro ao carregar a agenda. Tente novamente mais tarde.</p>';
            } finally {
                showLoading(false);
            }
        }

        document.addEventListener('DOMContentLoaded', carregarAgenda);
    </script>
</body>

</html>
