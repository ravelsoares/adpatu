<title>ENEM Bíblico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --dourado:#CAAB5B; --dourado-esc:#9A7B2E; --preto:#0a0a0a; --tinta:#161616; --cinza:#6b6b6b; --linha:#d6d6d6;
  --azul:#1f5fd6; --amarelo:#f2c200; --rosa:#e2559a; --branco:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#2a2a2a;color:var(--tinta);font-family:Inter,system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ---------- barra de controle (só na tela) ---------- */
.barra{position:sticky;top:0;z-index:10;background:var(--preto);color:#fff;padding:12px 16px;border-bottom:3px solid var(--dourado)}
.barra h1{font-family:Montserrat,sans-serif;font-weight:900;letter-spacing:.04em;margin:0 0 8px;font-size:22px}
.barra h1 span{color:var(--dourado)}
.abas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.abas button,.acao{font:600 13px Inter,sans-serif;border:1px solid #444;background:#1b1b1b;color:#eee;border-radius:999px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.abas button[aria-pressed="true"]{background:var(--dourado);border-color:var(--dourado);color:#000}
.abas .bola{width:11px;height:11px;border-radius:50%;border:1px solid #888;display:inline-block}
.acao{background:var(--dourado);color:#000;border-color:var(--dourado)}
.cfg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:#bbb}
.cfg input{font:13px Inter,sans-serif;background:#1b1b1b;border:1px solid #444;color:#fff;border-radius:6px;padding:6px 8px;min-width:0;width:220px;max-width:100%}
.dica{font-size:12px;color:#999;margin-top:6px}

/* ---------- folhas ---------- */
.folhas{padding:24px 16px 60px}
.folha{background:#fff;width:210mm;max-width:100%;margin:0 auto 24px;padding:14mm 12mm;box-shadow:0 6px 30px rgba(0,0,0,.4);position:relative}
.vista{display:none}
.vista.ativa{display:block}

/* capa */
.capa{padding:0;min-height:297mm;display:flex;flex-direction:column}
.capa-topo{background:var(--preto);color:#fff;padding:9mm 12mm 8mm;display:flex;gap:8mm;align-items:center;border-bottom:3mm solid var(--dourado)}
.capa-topo img{height:30mm;width:auto}
.capa-topo .t1{font-family:Montserrat,sans-serif;font-weight:900;font-size:34pt;line-height:1;letter-spacing:-.01em}
.capa-topo .t1 b{color:var(--dourado);font-weight:900}
.capa-topo .t2{font-size:11pt;letter-spacing:.18em;text-transform:uppercase;color:#ccc;margin-top:2mm}
.faixa-cor{display:flex;align-items:center;justify-content:space-between;padding:4mm 12mm;border-bottom:1px solid var(--linha)}
.faixa-cor .num{font-family:Montserrat,sans-serif;font-weight:900;font-size:24pt;line-height:1}
.faixa-cor .cor{font-family:Montserrat,sans-serif;font-weight:900;font-size:20pt;letter-spacing:.06em;padding:2mm 8mm;border:2px solid #000;border-radius:2mm}
.capa-corpo{padding:6mm 12mm;flex:1;display:flex;flex-direction:column;gap:5mm}
.campo{border:1.5px solid #000;border-radius:2mm;padding:2.5mm 3mm;font-size:8.5pt;color:var(--cinza);height:13mm}
.campos{display:grid;grid-template-columns:3fr 1fr;gap:3mm}
.capa h3{font:800 10pt Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:0 0 2mm;color:#000}
.capa ol{margin:0;padding-left:5mm;font-size:10pt;line-height:1.5}
.areas-tab{width:100%;border-collapse:collapse;font-size:10pt}
.areas-tab td{border-bottom:1px solid var(--linha);padding:2mm 1mm}
.areas-tab td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.capa-rodape{padding:5mm 12mm;border-top:1px solid var(--linha);font-size:9pt;color:var(--cinza);display:flex;justify-content:space-between;gap:4mm}
.verso{font-family:"Source Serif 4",serif;font-style:italic;font-size:11pt;color:#333;border-left:3px solid var(--dourado);padding-left:4mm}

/* questões */
.cab-cad{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:2mm;margin-bottom:4mm;font-size:8.5pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.cab-cad .marca{display:inline-flex;align-items:center;gap:2mm}
.cab-cad .marca i{width:4mm;height:4mm;border:1px solid #000;border-radius:50%;display:inline-block}
.colunas{column-count:2;column-gap:8mm;column-rule:1px solid var(--linha)}
.area-tit{break-inside:avoid;break-after:avoid;background:var(--preto);color:#fff;padding:2.2mm 3mm;margin:0 0 4mm;border-left:3mm solid var(--dourado);font-size:8.5pt;line-height:1.3}
.area-tit b{display:block;font-family:Montserrat,sans-serif;font-weight:900;font-size:10.5pt;letter-spacing:.01em}
.q{break-inside:avoid;margin:0 0 5.5mm;font-size:9.4pt;line-height:1.42}
.q .qn{font:800 9pt Inter,sans-serif;letter-spacing:.06em;display:inline-block;border-bottom:2px solid var(--dourado);margin-bottom:2mm}
.tb{font-family:"Source Serif 4",serif;font-size:9.8pt;margin:0 0 2.5mm;padding:2.5mm 3mm;background:#f5f5f5;border-left:2px solid #999}
.tb cite{display:block;text-align:right;font-style:normal;font-family:Inter,sans-serif;font-size:7.8pt;color:var(--cinza);margin-top:1mm}
.en{margin:0 0 2mm}
.alts{list-style:none;margin:0;padding:0}
.alts li{display:flex;gap:2mm;margin:0 0 1.2mm}
.alts .l{flex:0 0 5mm;height:5mm;border:1.2px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:7.5pt;margin-top:.2mm}
.fim{break-inside:avoid;text-align:center;font-family:Montserrat,sans-serif;font-weight:900;letter-spacing:.1em;margin-top:4mm;padding-top:3mm;border-top:2px solid #000}

/* rascunho */
.rasc{break-before:page;border:1.5px dashed #000;padding:5mm;margin-top:6mm}
.rasc h3{margin:0 0 1mm;font:800 10pt Inter;letter-spacing:.1em;text-transform:uppercase}
.rasc p{margin:0 0 3mm;font-size:8.5pt;color:var(--cinza)}
.rasc-grade{display:grid;grid-template-columns:repeat(9,1fr);gap:1.5mm}
.rasc-grade div{border:1px solid #999;font-size:7.5pt;padding:1mm;height:9mm;color:#555}

/* cartão-resposta */
.cartao h2{font-family:Montserrat,sans-serif;font-weight:900;font-size:20pt;margin:0;letter-spacing:.02em}
.cartao h2 b{color:var(--dourado-esc);font-weight:900}
.cartao .topo{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #000;padding-bottom:3mm;margin-bottom:4mm}
.cartao .topo small{font-size:8.5pt;color:var(--cinza)}
.cartao .campos{grid-template-columns:3fr 2fr 1fr;margin-bottom:4mm}
.cad-escolha{display:flex;flex-wrap:wrap;gap:6mm;align-items:center;border:1.5px solid #000;border-radius:2mm;padding:3mm 4mm;margin-bottom:3mm;font-size:9.5pt}
.cad-escolha strong{font-size:8.5pt;letter-spacing:.1em;text-transform:uppercase}
.cad-escolha span{display:inline-flex;align-items:center;gap:2mm}
.cad-escolha i{width:5mm;height:5mm;border:1.5px solid #000;border-radius:50%;display:inline-block}
.instr-cartao{font-size:8.5pt;color:#333;margin:0 0 4mm;display:flex;gap:4mm;align-items:center;flex-wrap:wrap}
.instr-cartao .ex{display:inline-flex;gap:1.5mm;align-items:center}
.bub{width:5.2mm;height:5.2mm;border:1.2px solid #000;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:7pt;font-weight:700}
.bub.on{background:#000;color:#000}
.grade-resp{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
.bloco-resp{border:1.5px solid #000;border-radius:2mm;padding:2mm 3mm}
.bloco-resp .lin{display:flex;align-items:center;gap:1.6mm;padding:1.05mm 0;border-bottom:1px dotted #bbb}
.bloco-resp .lin:last-child{border-bottom:0}
.bloco-resp .lin:nth-child(5n){border-bottom:1px solid #000}
.bloco-resp .n{width:7mm;font-weight:800;font-size:9pt;text-align:right;margin-right:1mm}
.ass{margin-top:6mm;display:grid;grid-template-columns:2fr 1fr;gap:6mm;font-size:8.5pt;color:var(--cinza)}
.ass div{border-top:1px solid #000;padding-top:1mm}
.nota{border:2px solid #000!important;border-radius:2mm;padding:2mm!important;height:16mm}

/* gabaritos */
.gab h2{font-family:Montserrat,sans-serif;font-weight:900;font-size:18pt;margin:0 0 1mm}
.gab h2 b{color:var(--dourado-esc);font-weight:900}
.gab .sub{font-size:9pt;color:var(--cinza);margin:0 0 5mm}
.gab-grade{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;margin-bottom:6mm}
.gab-cad{border:1.5px solid #000;border-radius:2mm;overflow:hidden;break-inside:avoid}
.gab-cad h4{margin:0;padding:2mm 3mm;font:800 9pt Inter;letter-spacing:.08em;text-transform:uppercase;border-bottom:1.5px solid #000;display:flex;align-items:center;gap:2mm}
.gab-cad h4 i{width:4mm;height:4mm;border:1px solid #000;border-radius:50%;display:inline-block}
.gab-cad table{width:100%;border-collapse:collapse;font-size:8.6pt}
.gab-cad td{padding:.55mm 2mm;border-bottom:1px solid #eee;text-align:center}
.gab-cad td:first-child{text-align:right;color:var(--cinza);width:45%}
.gab-cad td:last-child{font-weight:800}
.gab-cad tr:nth-child(5n) td{border-bottom:1px solid #999}
.dist{font-size:7.5pt;color:var(--cinza);padding:1.5mm 2mm;border-top:1px solid #000}
.com{break-before:page}
.com-item{break-inside:avoid;border-bottom:1px solid var(--linha);padding:2.5mm 0;font-size:9pt;line-height:1.4;display:grid;grid-template-columns:30mm 1fr;gap:4mm}
.com-item .map{font-size:7.8pt;line-height:1.5}
.com-item .map span{display:flex;align-items:center;gap:1.5mm}
.com-item .map i{width:3mm;height:3mm;border:1px solid #000;border-radius:50%;display:inline-block}
.com-item .resp{font-weight:700}
.com-item .meta{font-size:7.8pt;color:var(--cinza);letter-spacing:.04em;text-transform:uppercase;margin-bottom:.5mm}
.tag{display:inline-block;border:1px solid #999;border-radius:1mm;padding:0 1.2mm;margin-left:1mm}
.com-area{font:800 9pt Inter;letter-spacing:.08em;text-transform:uppercase;background:var(--preto);color:#fff;padding:1.8mm 3mm;border-left:3mm solid var(--dourado);margin:4mm 0 1mm;break-after:avoid}

@media screen and (max-width:820px){
  .folhas{padding:16px 8px 40px}
  .folha{padding:8mm 6mm}
  .colunas{column-count:1}
  .gab-grade{grid-template-columns:repeat(2,1fr)}
  .grade-resp{grid-template-columns:1fr}
  .capa-topo .t1{font-size:32pt}
}

@page{size:A4;margin:12mm 11mm 14mm}
@media print{
  body{background:#fff}
  .barra{display:none}
  .folhas{padding:0}
  .folha{box-shadow:none;margin:0;width:auto;max-width:none;padding:0}
  .capa{min-height:0}
  .capa-corpo{flex:none}
  .cab-cad{display:none}
  .capa-topo,.faixa-cor,.capa-corpo,.capa-rodape{padding-left:6mm;padding-right:6mm}
  .vista:not(.ativa){display:none!important}
  .quebra{break-before:page}
}
</style>
<style id="paginas"></style>
</head>
<body>

<div class="barra">
  <h1>ENEM <span>BÍBLICO</span> · gerador de cadernos</h1>
  <div class="abas" id="abas"></div>
  <div class="cfg">
    <label>Evento <input id="cfgEvento" value="ENEM Bíblico 2026"></label>
    <label>Data e local <input id="cfgData" placeholder="ex.: 28/11/2026 · Templo Central"></label>
    <button class="acao" onclick="window.print()">🖨 Imprimir esta aba</button>
  </div>
  <div class="dica">Na impressão, escolha papel A4 e ative “Gráficos de plano de fundo”. Cada caderno sai com a capa, as 45 questões e o rascunho do gabarito.</div>
</div>

<div class="folhas" id="folhas"></div>

<script>
/* =========================================================
   BANCO DE QUESTÕES — 5 áreas × 9 questões
   d: F (fácil) · M (média) · D (difícil)
   t/f: texto-base e fonte · e: enunciado · c: correta · w: erradas · r: comentário
   ========================================================= */
const AREAS = [
  {nome:"Pentateuco e Livros Históricos", desc:"Gênesis a Ester"},
  {nome:"Livros Poéticos e Proféticos",   desc:"Jó a Malaquias"},
  {nome:"Evangelhos e Atos",              desc:"Mateus a Atos dos Apóstolos"},
  {nome:"Epístolas e Apocalipse",         desc:"Romanos a Apocalipse"},
  {nome:"Doutrina, Interpretação e Vida Cristã", desc:"Fundamentos da fé e aplicação prática"}
];

const Q = [
/* ---------- ÁREA 1 ---------- */
{a:0,d:"F",f:"Gênesis 12.1-2",
 t:"Ora, o Senhor disse a Abrão: Sai-te da tua terra, e da tua parentela, e da casa de teu pai, para a terra que eu te mostrarei. E far-te-ei uma grande nação, e abençoar-te-ei, e engrandecerei o teu nome; e tu serás uma bênção.",
 e:"O chamado de Abrão é relembrado em Hebreus 11.8, que diz que ele “saiu, sem saber para onde ia”. A resposta de Abrão ao chamado foi marcada por",
 c:"obediência confiante, saindo antes de conhecer todo o caminho, apoiado apenas na promessa de Deus.",
 w:["uma recompensa que Deus lhe devia pelas boas obras que já havia praticado em Ur.",
    "uma ordem para conquistar o Egito e formar ali uma grande nação.",
    "uma bênção que ficaria restrita a Abrão e à sua casa, sem alcançar outras pessoas.",
    "uma exigência de que ele construísse um templo antes de receber qualquer promessa."],
 r:"A promessa vem antes de qualquer mérito. Abrão obedece pela fé, e a bênção alcança o mundo inteiro (Gn 12.3: “em ti serão benditas todas as famílias da terra”)."},

{a:0,d:"F",f:"Gênesis 50.20",
 t:"Vós bem intentastes mal contra mim, porém Deus o tornou em bem, para fazer como se vê neste dia, para conservar em vida a um povo grande.",
 e:"José diz essas palavras aos irmãos que, anos antes, o haviam vendido como escravo. A fala mostra que José",
 c:"reconhece o mal praticado pelos irmãos, mas vê Deus agindo soberanamente para transformar aquela situação em livramento.",
 w:["negava que os irmãos tivessem errado, pois eles haviam planejado tudo para o bem dele.",
    "estava adiando a vingança até que o pai deles, Jacó, morresse.",
    "ensina que o mal deixa de ser pecado quando dá certo no final.",
    "acreditava que Deus obrigou os irmãos a pecar e que, por isso, eles não tinham culpa."],
 r:"José não chama o mal de bem (“intentastes mal”), mas confessa a soberania de Deus sobre a história (cf. Rm 8.28). O perdão de José nasce dessa confiança."},

{a:0,d:"M",f:"Êxodo a Josué",
 e:"Assinale a alternativa que apresenta a ordem cronológica correta dos acontecimentos da história de Israel narrados de Êxodo a Josué.",
 c:"Pragas no Egito → travessia do Mar Vermelho → entrega da Lei no Sinai → peregrinação de 40 anos no deserto → travessia do Jordão sob Josué.",
 w:["Travessia do Mar Vermelho → pragas no Egito → entrega da Lei no Sinai → travessia do Jordão sob Josué → peregrinação de 40 anos no deserto.",
    "Pragas no Egito → entrega da Lei no Sinai → travessia do Mar Vermelho → peregrinação de 40 anos no deserto → travessia do Jordão sob Josué.",
    "Pragas no Egito → travessia do Mar Vermelho → peregrinação de 40 anos no deserto → travessia do Jordão sob Josué → entrega da Lei no Sinai.",
    "Entrega da Lei no Sinai → pragas no Egito → travessia do Mar Vermelho → travessia do Jordão sob Josué → peregrinação de 40 anos no deserto."],
 r:"Êx 7–12 (pragas), Êx 14 (Mar Vermelho), Êx 19–20 (Sinai), Nm 14 (sentença dos 40 anos) e Js 3 (Jordão)."},

{a:0,d:"M",f:"Rute 1.16",
 t:"Porém Rute disse: Não me instes para que te deixe e me afaste de ti; porque aonde quer que tu fores irei eu e onde quer que pousares, ali pousarei eu; o teu povo é o meu povo, o teu Deus é o meu Deus.",
 e:"Rute era moabita. Mais tarde, tornou-se bisavó do rei Davi (Rt 4.17) e aparece na genealogia de Jesus (Mt 1.5). A partir desses dados, a história de Rute mostra que",
 c:"a graça de Deus alcançava pessoas de fora de Israel que se voltavam para Ele, incluindo-as no Seu plano de redenção.",
 w:["Rute pertencia à tribo de Judá e, por isso, tinha direito à herança de Noemi.",
    "Noemi obrigou a nora a abandonar seus deuses como condição para sustentá-la.",
    "o livro proíbe que israelitas se casem com pessoas de outros povos que se converteram.",
    "Rute ganhou destaque porque se tornou rainha de Moabe depois da morte do marido."],
 r:"Rute escolhe o Deus de Israel por amor e fidelidade, e Deus a coloca na linhagem messiânica. É uma prévia do evangelho para todas as nações."},

{a:0,d:"M",f:"1 Samuel 15.22",
 t:"Porém Samuel disse: Tem, porventura, o Senhor tanto prazer em holocaustos e sacrifícios como em que se obedeça à palavra do Senhor? Eis que o obedecer é melhor do que o sacrificar; e o atender melhor é do que a gordura de carneiros.",
 e:"Samuel repreende Saul, que desobedeceu a uma ordem clara de Deus e alegou ter poupado o melhor do gado para oferecê-lo em sacrifício. O princípio afirmado pelo profeta é que",
 c:"nenhum ato religioso exterior substitui a obediência sincera à palavra de Deus.",
 w:["os sacrifícios foram abolidos naquele momento e não deveriam mais ser oferecidos.",
    "Saul agiu bem, pois oferecer o melhor a Deus justifica mudar a ordem recebida.",
    "uma oferta generosa compensa uma desobediência pontual.",
    "a obediência é importante apenas para reis e líderes, e não para o povo."],
 r:"Os sacrifícios continuaram até Cristo, mas sem obediência eles perdiam o valor. Por essa desobediência, Saul foi rejeitado como rei (1 Sm 15.23)."},

{a:0,d:"F",f:"Gênesis 1.27",
 t:"E criou Deus o homem à sua imagem; à imagem de Deus o criou; macho e fêmea os criou.",
 e:"Uma consequência prática da verdade expressa nesse versículo para a convivência cristã é",
 c:"tratar toda pessoa com dignidade, sem distinção de cor, classe social, idade ou condição, pois todos carregam a imagem de Deus.",
 w:["considerar que somente os que creem têm valor diante de Deus.",
    "entender que Deus tem um corpo físico igual ao do ser humano.",
    "concluir que homem e mulher têm valores diferentes diante do Criador.",
    "aceitar que o ser humano, por ser imagem de Deus, não é capaz de pecar."],
 r:"A imagem de Deus dá dignidade a todo ser humano, inclusive ao homem e à mulher, que a carregam igualmente. A queda (Gn 3) desfigurou essa imagem, mas não a apagou (Gn 9.6; Tg 3.9)."},

{a:0,d:"F",f:"1 Reis 18.21",
 t:"Então, Elias se chegou a todo o povo e disse: Até quando coxeareis entre dois pensamentos? Se o Senhor é Deus, segui-o; e, se Baal, segui-o. Porém o povo lhe não respondeu nada.",
 e:"No monte Carmelo, Elias confronta o povo de Israel, que tentava servir ao Senhor e a Baal ao mesmo tempo. Para a vida cristã hoje, a mensagem central do texto é",
 c:"a necessidade de uma decisão total por Deus, sem dividir o coração entre Ele e os “ídolos” de cada época.",
 w:["a liberdade de escolher qualquer deus, já que todas as religiões levam ao mesmo lugar.",
    "a orientação de evitar conflitos religiosos e ficar em silêncio, como fez o povo.",
    "a ideia de que Deus aceita parte do coração, desde que a pessoa vá ao culto.",
    "a ordem para que o cristão deixe de conviver com quem não crê."],
 r:"“Coxear entre dois pensamentos” é tentar conciliar Deus e ídolos. Deus pede um coração inteiro (Mt 6.24)."},

{a:0,d:"D",f:"Esdras, Neemias e Ester",
 e:"Associe os personagens judeus do período persa às suas atuações:<br><b>I.</b> Esdras &nbsp; <b>II.</b> Neemias &nbsp; <b>III.</b> Ester<br>(a) Intercedeu diante do rei Assuero para livrar os judeus de um decreto de extermínio.<br>(b) Liderou a reconstrução dos muros de Jerusalém, enfrentando oposição.<br>(c) Escriba que preparou o coração para buscar, cumprir e ensinar a Lei do Senhor.<br>A associação correta é",
 c:"I–c, II–b, III–a.",
 w:["I–b, II–c, III–a.","I–a, II–b, III–c.","I–c, II–a, III–b.","I–b, II–a, III–c."],
 r:"Esdras 7.10 (ensino da Lei), Neemias 2–6 (muros) e Ester 4–8 (intercessão diante de Assuero)."},

{a:0,d:"D",f:"Juízes 21.25",
 t:"Naqueles dias, não havia rei em Israel, porém cada um fazia o que parecia reto aos seus olhos.",
 e:"O livro de Juízes mostra um ciclo que se repete várias vezes na história de Israel (Jz 2.11-19). Esse ciclo está descrito corretamente em:",
 c:"Pecado e idolatria → opressão por povos vizinhos → clamor a Deus → livramento por meio de um juiz → período de paz → novo afastamento.",
 w:["Opressão → pecado → coroação de um rei → paz definitiva → construção do templo.",
    "Livramento por um juiz → pecado → paz → opressão → exílio na Babilônia.",
    "Clamor → pecado → paz → livramento → opressão, sem repetição ao longo do livro.",
    "Pecado → castigo → destruição definitiva das tribos → fim da aliança com Israel."],
 r:"O ciclo mostra a infidelidade do povo e a misericórdia persistente de Deus. O versículo final aponta a necessidade de um rei justo, que se cumpre plenamente em Cristo."},

/* ---------- ÁREA 2 ---------- */
{a:1,d:"F",f:"Salmo 23.1-3",
 t:"O Senhor é o meu pastor; nada me faltará. Deitar-me faz em verdes pastos, guia-me mansamente a águas tranquilas. Refrigera a minha alma; guia-me pelas veredas da justiça, por amor do seu nome.",
 e:"Ao chamar o Senhor de “pastor”, Davi, que havia sido pastor de ovelhas, usa essa imagem para expressar",
 c:"o cuidado pessoal, a provisão e a direção constantes de Deus sobre a vida de quem confia nele.",
 w:["a promessa de que o crente nunca passará por momentos difíceis.",
    "a ideia de que Deus cuida apenas de quem trabalha com animais no campo.",
    "uma crítica aos líderes de Israel, sem relação com a experiência pessoal do salmista.",
    "a ideia de que a ovelha não tem nenhuma responsabilidade de seguir o pastor."],
 r:"O próprio salmo fala do “vale da sombra da morte” (v. 4). O cuidado de Deus não elimina as lutas, mas garante Sua presença nelas. Jesus se apresenta como o Bom Pastor (Jo 10.11)."},

{a:1,d:"D",f:"Jó 1.21",
 t:"Nu saí do ventre de minha mãe e nu tornarei para lá; o Senhor o deu e o Senhor o tomou; bendito seja o nome do Senhor.",
 e:"Os amigos de Jó insistiram que o sofrimento dele era castigo por algum pecado escondido. No final do livro, porém, Deus declara que eles não falaram o que era reto (Jó 42.7). Uma lição correta do livro é que",
 c:"o sofrimento nem sempre é consequência direta de um pecado pessoal, e Deus continua digno de confiança mesmo quando não explica tudo.",
 w:["todo sofrimento é castigo por pecado, e quem sofre deve descobrir qual foi o seu erro.",
    "Jó nunca questionou nem lamentou, e ficou calado durante todo o livro.",
    "as pessoas fiéis a Deus estão livres de perdas e dores nesta vida.",
    "Deus perdeu o controle da situação, e Satanás agiu sem a Sua permissão."],
 r:"Jó lamentou e questionou, mas não amaldiçoou a Deus. Satanás só agiu com permissão (Jó 1.12), e Deus repreendeu a teologia simplista dos amigos."},

{a:1,d:"F",f:"Provérbios 1.7",
 t:"O temor do Senhor é o princípio da ciência; os loucos desprezam a sabedoria e a instrução.",
 e:"No livro de Provérbios, a expressão “temor do Senhor” significa",
 c:"reverência e respeito a Deus, que levam a pessoa a viver segundo a Sua vontade e são a base da verdadeira sabedoria.",
 w:["medo constante de Deus, como de alguém que castiga sem amor.",
    "um sentimento que impede o estudo e a busca por conhecimento.",
    "uma prática reservada aos sacerdotes no templo.",
    "a ideia de que o conhecimento humano é sempre contrário à fé."],
 r:"Temer a Deus é reconhecer quem Ele é e submeter a vida a Ele. É o ponto de partida do conhecimento, e não um obstáculo a ele."},

{a:1,d:"M",f:"Eclesiastes 12.13",
 t:"De tudo o que se tem ouvido, o fim é: Teme a Deus e guarda os seus mandamentos; porque este é o dever de todo homem.",
 e:"Ao longo de Eclesiastes, o Pregador repete que tudo “debaixo do sol” é “vaidade”. Pela conclusão do livro, essa repetição serve para mostrar que",
 c:"riqueza, prazer, trabalho e sabedoria, quando buscados longe de Deus, não dão sentido à vida, que só é encontrado no temor a Ele.",
 w:["a vida não tem nenhum sentido, e nada do que se faz tem valor diante de Deus.",
    "o melhor caminho é buscar o prazer acima de tudo, porque a vida é curta.",
    "o Pregador abandonou a fé e escreveu o livro para criticar a Deus.",
    "o trabalho é pecado e deve ser evitado por quem teme a Deus."],
 r:"“Vaidade” traduz a ideia de vapor, de algo passageiro. O livro desmonta as falsas fontes de sentido e conduz o leitor de volta a Deus."},

{a:1,d:"F",f:"Isaías 53.5",
 t:"Mas ele foi ferido pelas nossas transgressões e moído pelas nossas iniquidades; o castigo que nos traz a paz estava sobre ele, e pelas suas pisaduras fomos sarados.",
 e:"Esse texto foi escrito séculos antes de Cristo, e o Novo Testamento o aplica a Jesus (1 Pe 2.24). Ele apresenta a morte do Messias como",
 c:"substitutiva: Ele sofreu o castigo que nós merecíamos, para que tivéssemos paz com Deus.",
 w:["um acidente histórico, sem relação com o plano de Deus.",
    "apenas um exemplo de coragem, sem efeito sobre o pecado humano.",
    "um castigo pelos pecados que o próprio Messias havia cometido.",
    "uma derrota que impediu o cumprimento das promessas feitas a Israel."],
 r:"“Pelas nossas transgressões”: o Servo sofre no lugar de outros. Filipe usou Isaías 53 para anunciar Jesus ao eunuco etíope (At 8.32-35)."},

{a:1,d:"M",f:"Jonas 4.2 (trecho)",
 t:"…pois sabia que és Deus piedoso e misericordioso, longânimo e grande em benignidade e que te arrependes do mal.",
 e:"Jonas fugiu da missão de pregar em Nínive, capital da Assíria, inimiga de Israel. Depois que a cidade se arrependeu e foi poupada, ele ficou irado e explicou o motivo da fuga com as palavras acima. O livro revela, principalmente, que",
 c:"a misericórdia de Deus alcança até os inimigos do Seu povo, e Ele confronta o coração de quem deseja limitá-la.",
 w:["Jonas fugiu porque tinha medo de ser morto pelos ninivitas.",
    "Deus desistiu de Jonas e enviou outro profeta a Nínive.",
    "Nínive foi destruída, como Jonas desejava.",
    "a mensagem de Deus era só para Israel, e Nínive foi uma exceção por acaso."],
 r:"O próprio Jonas confessa o motivo: ele sabia que Deus é misericordioso. O livro termina com uma pergunta de Deus sobre a compaixão por Nínive (Jn 4.11)."},

{a:1,d:"D",f:"Jeremias 29.11",
 t:"Porque eu bem sei os pensamentos que penso de vós, diz o Senhor; pensamentos de paz e não de mal, para vos dar o fim que esperais.",
 e:"Esse versículo faz parte de uma carta que Jeremias enviou aos judeus levados cativos para a Babilônia. No versículo anterior, Deus diz que os visitaria quando se cumprissem setenta anos (Jr 29.10). Uma leitura fiel ao contexto entende que essa promessa",
 c:"fala de restauração no tempo de Deus e sustenta a esperança do povo durante uma longa espera, sem garantir sucesso imediato.",
 w:["garante prosperidade financeira em pouco tempo a quem a declarar.",
    "foi feita aos babilônios como recompensa por terem conquistado Jerusalém.",
    "anuncia que o cativeiro terminaria em poucos dias, sem necessidade de espera.",
    "ensina que Deus não tinha planos para o povo enquanto ele estava no exílio."],
 r:"Na mesma carta, Deus manda o povo construir casas e buscar a paz da cidade (Jr 29.5-7). A esperança é real, mas vem no tempo dEle. O versículo continua valendo, desde que lido no seu contexto."},

{a:1,d:"M",f:"Daniel 3.17-18",
 t:"Eis que o nosso Deus, a quem nós servimos, é que nos pode livrar; ele nos livrará do forno de fogo ardente e da tua mão, ó rei. E, se não, fica sabendo, ó rei, que não serviremos a teus deuses nem adoraremos a estátua de ouro que levantaste.",
 e:"A resposta de Sadraque, Mesaque e Abede-Nego ao rei Nabucodonosor mostra uma fé que",
 c:"confia no poder de Deus para livrar, mas continua fiel a Ele mesmo que o livramento não aconteça.",
 w:["só obedece a Deus quando tem certeza antecipada do milagre.",
    "aceita adorar a estátua por fora, desde que o coração continue fiel.",
    "desafia o rei por orgulho, buscando reconhecimento pessoal.",
    "duvidava do poder de Deus e, por isso, preparou uma fuga."],
 r:"“E, se não…”: a fidelidade deles não dependia do resultado. Deus esteve com eles dentro da fornalha (Dn 3.25)."},

{a:1,d:"M",f:"Joel 2.12-13",
 t:"Ainda assim, agora mesmo diz o Senhor: Convertei-vos a mim de todo o vosso coração; e isso com jejuns, e com choro, e com pranto. E rasgai o vosso coração, e não as vossas vestes, e convertei-vos ao Senhor, vosso Deus; porque ele é misericordioso, e compassivo, e tardio em irar-se, e grande em benignidade.",
 e:"Em Israel, rasgar as roupas era um sinal público de tristeza e arrependimento. Ao ordenar “rasgai o vosso coração, e não as vossas vestes”, o profeta Joel ensina que",
 c:"Deus deseja um arrependimento verdadeiro e interior, que não se limite a gestos exteriores.",
 w:["jejum e choro são proibidos para quem deseja se converter.",
    "as roupas eram sagradas e não podiam ser rasgadas.",
    "basta demonstrar tristeza em público para ser perdoado.",
    "o arrependimento é desnecessário, porque Deus é misericordioso."],
 r:"O texto não condena o jejum e o choro (v. 12), mas exige que venham de um coração quebrantado. A conversão é “de todo o vosso coração”."},

/* ---------- ÁREA 3 ---------- */
{a:2,d:"F",f:"Mateus 5.13-14,16",
 t:"Vós sois o sal da terra; e, se o sal for insípido, com que se há de salgar? […] Vós sois a luz do mundo; não se pode esconder uma cidade edificada sobre um monte. […] Assim resplandeça a vossa luz diante dos homens, para que vejam as vossas boas obras e glorifiquem o vosso Pai, que está nos céus.",
 e:"Com as imagens do sal e da luz, Jesus ensina que os seus discípulos devem",
 c:"influenciar positivamente o ambiente em que vivem, de modo que suas atitudes levem as pessoas a glorificar a Deus.",
 w:["se isolar do mundo para não serem contaminados.",
    "praticar boas obras para receber elogios das pessoas.",
    "esconder a fé para evitar conflitos no trabalho, na escola e na família.",
    "se preocupar apenas com a própria salvação."],
 r:"Sal preserva e dá sabor, e luz ilumina. Ambos só funcionam em contato com o ambiente. O objetivo é a glória do Pai, e não a do discípulo (cf. Mt 6.1)."},

{a:2,d:"M",f:"Lucas 15.28-29",
 t:"Mas ele se indignou e não queria entrar. E, saindo o pai, instava com ele. Mas, respondendo ele, disse ao pai: Eis que te sirvo há tantos anos, sem nunca transgredir o teu mandamento, e nunca me deste um cabrito para alegrar-me com os meus amigos.",
 e:"Jesus contou a parábola do filho pródigo a fariseus e escribas que murmuravam porque ele recebia pecadores (Lc 15.1-2). A atitude do filho mais velho representa",
 c:"uma religiosidade baseada no próprio desempenho, que não se alegra quando pecadores são recebidos pela graça.",
 w:["o filho exemplar, que Jesus apresenta como modelo a ser imitado.",
    "os pecadores que se arrependem e voltam para casa.",
    "Deus Pai, que exige obediência antes de perdoar.",
    "os gentios que ainda não conheciam a lei de Moisés."],
 r:"A parábola tem dois filhos perdidos: um longe de casa e outro dentro dela. O irmão mais velho retrata os ouvintes que reclamavam da graça."},

{a:2,d:"M",f:"Lucas 10.25-37",
 e:"Um doutor da lei perguntou a Jesus: “E quem é o meu próximo?” (Lc 10.29). Jesus respondeu com a parábola do bom samaritano. Nela, um sacerdote e um levita passam ao largo de um homem ferido, e um samaritano, de um povo com quem os judeus tinham inimizade, cuida dele. A lição central da parábola é que",
 c:"ser próximo é agir com misericórdia com quem precisa, ultrapassando barreiras religiosas, étnicas e sociais.",
 w:["o próximo é somente quem pertence à mesma religião e ao mesmo povo.",
    "sacerdotes e levitas eram, por natureza, pessoas más.",
    "só é obrigatório ajudar alguém quando não há risco nem custo.",
    "a Lei de Moisés já não tinha nenhum valor."],
 r:"Jesus inverte a pergunta: o importante não é saber quem merece ajuda, e sim de quem eu me torno próximo. O herói da história é justamente o “inimigo”. “Vai e faze da mesma maneira” (v. 37)."},

{a:2,d:"F",f:"João 3.16",
 t:"Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna.",
 e:"Segundo esse versículo, a condição para que a pessoa não pereça, mas tenha a vida eterna, é",
 c:"crer no Filho que Deus deu.",
 w:["nascer em uma família cristã.",
    "praticar mais boas obras do que más.",
    "frequentar o templo com regularidade.",
    "conhecer toda a Lei de Moisés."],
 r:"A iniciativa é de Deus (amou, deu), e a resposta humana é crer. “Todo aquele” mostra que o convite é para todos."},

{a:2,d:"M",f:"Evangelho de João",
 e:"No Evangelho de João, Jesus usa várias vezes a expressão “Eu sou” para revelar quem Ele é. Qual das declarações abaixo NÃO está entre os “Eu sou” registrados nesse Evangelho?",
 c:"“Eu sou a fonte de toda a sabedoria.”",
 w:["“Eu sou o pão da vida.”","“Eu sou a luz do mundo.”","“Eu sou o bom Pastor.”","“Eu sou a videira verdadeira.”"],
 r:"Os “Eu sou” de João: pão da vida (6.35), luz do mundo (8.12), porta (10.9), bom Pastor (10.11), ressurreição e vida (11.25), caminho, verdade e vida (14.6) e videira verdadeira (15.1)."},

{a:2,d:"M",f:"Mateus 28.19-20",
 t:"Portanto, ide, ensinai todas as nações, batizando-as em nome do Pai, e do Filho, e do Espírito Santo; ensinando-as a guardar todas as coisas que eu vos tenho mandado; e eis que eu estou convosco todos os dias, até à consumação dos séculos.",
 e:"Na Grande Comissão, Jesus ordena à Igreja",
 c:"ensinar todas as nações, batizá-las e ensiná-las a guardar tudo o que Ele mandou, contando com a Sua presença até o fim.",
 w:["pregar apenas aos judeus até que todo Israel se converta.",
    "batizar as pessoas, sem necessidade de ensino depois do batismo.",
    "permanecer em Jerusalém até a volta de Cristo, sem sair para evangelizar.",
    "usar os milagres como a única forma de anunciar o evangelho."],
 r:"A missão é fazer discípulos, e não apenas convertidos: ensinar, batizar e ensinar a obedecer. A ordem vem com a promessa da presença de Cristo."},

{a:2,d:"F",f:"Atos 2",
 e:"No dia de Pentecostes, os discípulos foram cheios do Espírito Santo e começaram a falar em outras línguas (At 2.4). Ao explicar o acontecimento à multidão, Pedro afirmou que se cumpria a profecia de",
 c:"Joel.",
 w:["Jonas.","Malaquias.","Daniel.","Ezequiel."],
 r:"“Isto é o que foi dito pelo profeta Joel” (At 2.16-17, citando Jl 2.28): “derramarei do meu Espírito sobre toda a carne”."},

{a:2,d:"D",f:"Atos 1.8",
 t:"Mas recebereis a virtude do Espírito Santo, que há de vir sobre vós; e ser-me-eis testemunhas, tanto em Jerusalém como em toda a Judeia e Samaria e até aos confins da terra.",
 e:"Esse versículo funciona como um roteiro do livro de Atos. A expansão do evangelho narrada no livro segue a ordem:",
 c:"Jerusalém (cap. 1–7) → Judeia e Samaria (cap. 8–12) → confins da terra, com as viagens de Paulo e sua chegada a Roma (cap. 13–28).",
 w:["Roma → Samaria → Jerusalém, terminando com Paulo preso em Jerusalém.",
    "Samaria → Jerusalém → Antioquia, terminando com a volta de Pedro à Galileia.",
    "Confins da terra → Judeia → Jerusalém, terminando com o Pentecostes.",
    "Galileia → Jerusalém → Egito, terminando com a morte de Paulo em Atenas."],
 r:"A perseguição depois da morte de Estêvão espalha a igreja pela Judeia e Samaria (At 8.1). A partir do cap. 13, Paulo leva o evangelho aos gentios, e o livro termina com ele pregando em Roma (At 28.30-31)."},

{a:2,d:"M",f:"Atos 10.34-35",
 t:"E, abrindo Pedro a boca, disse: Reconheço, por verdade, que Deus não faz acepção de pessoas; mas que lhe é agradável aquele que, em qualquer nação, o teme e faz o que é justo.",
 e:"Pedro disse essas palavras na casa de Cornélio, um centurião romano, depois de uma visão em que Deus lhe ordenava não chamar de comum o que Ele havia purificado. O episódio marca",
 c:"a abertura da Igreja aos gentios, mostrando que o evangelho é para pessoas de todas as nações.",
 w:["a decisão de que os gentios precisavam primeiro se tornar judeus para serem salvos.",
    "a conversão de Saulo no caminho de Damasco.",
    "o momento em que Pedro deixou de crer em Jesus.",
    "a proibição de os apóstolos entrarem em casas de estrangeiros."],
 r:"O Espírito Santo desce sobre os gentios, e Pedro manda batizá-los (At 10.44-48). Mais tarde, o concílio de Jerusalém confirma que eles não precisavam se tornar judeus (At 15)."},

/* ---------- ÁREA 4 ---------- */
{a:3,d:"F",f:"Romanos 3.23 e 6.23",
 t:"Porque todos pecaram e destituídos estão da glória de Deus. […] Porque o salário do pecado é a morte, mas o dom gratuito de Deus é a vida eterna, por Cristo Jesus, nosso Senhor.",
 e:"Ao comparar “salário” e “dom gratuito”, Paulo ensina que",
 c:"a morte é a consequência merecida do pecado, enquanto a vida eterna é um presente de Deus, recebido em Cristo, e não conquistado.",
 w:["a vida eterna é o pagamento de quem trabalha bastante na obra de Deus.",
    "apenas algumas pessoas pecaram e, por isso, só elas precisam de salvação.",
    "o pecado não tem consequências para quem frequenta a igreja.",
    "Deus dá vida eterna a todos igualmente, independentemente de Cristo."],
 r:"Salário é aquilo que se recebe por merecimento; dom é presente. “Todos pecaram”: ninguém fica de fora da necessidade, e a salvação vem “por Cristo Jesus”."},

{a:3,d:"M",f:"Efésios 2.8-10",
 t:"Porque pela graça sois salvos, por meio da fé; e isso não vem de vós; é dom de Deus. Não vem das obras, para que ninguém se glorie. Porque somos feitura sua, criados em Cristo Jesus para as boas obras, as quais Deus preparou para que andássemos nelas.",
 e:"De acordo com o texto, a relação correta entre salvação e boas obras é:",
 c:"as boas obras são fruto da salvação recebida pela graça, e não a sua causa.",
 w:["as boas obras são o meio pelo qual a pessoa merece a salvação.",
    "depois de salva, a pessoa não precisa mais praticar boas obras.",
    "a fé é uma obra humana que compra a graça de Deus.",
    "graça e obras somam meio a meio para garantir a salvação."],
 r:"Os versículos 8 e 9 negam que as obras sejam a causa da salvação. O versículo 10 afirma que elas são o propósito dela: somos salvos para as boas obras, e não por elas."},

{a:3,d:"F",f:"1 Coríntios 13.4-5",
 t:"O amor é sofredor, é benigno; o amor não é invejoso; o amor não trata com leviandade, não se ensoberbece, não se porta com indecência, não busca os seus interesses, não se irrita, não suspeita mal.",
 e:"Qual das atitudes abaixo CONTRARIA a descrição do amor feita por Paulo?",
 c:"Ajudar alguém somente quando isso traz alguma vantagem pessoal.",
 w:["Ter paciência com um irmão que demora a mudar.",
    "Alegrar-se com a conquista de um colega, sem inveja.",
    "Não se vangloriar dos próprios dons diante dos outros.",
    "Evitar pensar o pior sobre as intenções de alguém."],
 r:"“Não busca os seus interesses” (v. 5). Paulo escreve a uma igreja cheia de dons, mas dividida por orgulho, e mostra o amor como o “caminho ainda mais excelente” (1 Co 12.31)."},

{a:3,d:"M",f:"1 Coríntios 15.14,17",
 t:"E, se Cristo não ressuscitou, logo é vã a nossa pregação, e também é vã a vossa fé. […] E, se Cristo não ressuscitou, é vã a vossa fé, e ainda permaneceis nos vossos pecados.",
 e:"Com esse argumento, Paulo mostra que a ressurreição de Cristo é",
 c:"fundamental para a fé cristã: sem ela, a pregação e a fé perdem o sentido e não há perdão de pecados.",
 w:["um detalhe secundário, que pode ser aceito ou não sem prejuízo para a fé.",
    "apenas um símbolo de renovação interior, e não um fato histórico.",
    "uma doutrina criada pela igreja de Corinto e contestada por Paulo.",
    "importante apenas para os judeus, e não para os gentios."],
 r:"Paulo lista testemunhas da ressurreição, entre elas mais de quinhentos irmãos de uma vez (15.6), e conclui: “Mas, agora, Cristo ressuscitou dos mortos” (15.20)."},

{a:3,d:"F",f:"Gálatas 5.22-23",
 e:"Qual das alternativas abaixo NÃO faz parte do fruto do Espírito, segundo Gálatas 5.22-23?",
 c:"Profecia.",
 w:["Longanimidade.","Mansidão.","Temperança.","Benignidade."],
 r:"O fruto do Espírito é: amor, gozo, paz, longanimidade, benignidade, bondade, fé, mansidão e temperança. Profecia é um dom espiritual (1 Co 12.10). O fruto é caráter; os dons são capacitações."},

{a:3,d:"M",f:"Tiago 2.17-18",
 t:"Assim também a fé, se não tiver as obras, é morta em si mesma. Mas dirá alguém: Tu tens a fé, e eu tenho as obras; mostra-me a tua fé sem as tuas obras, e eu te mostrarei a minha fé pelas minhas obras.",
 e:"Paulo afirma que somos salvos pela fé, e não pelas obras (Ef 2.8-9). Tiago afirma que a fé sem obras é morta. Essas afirmações se harmonizam porque",
 c:"a fé que salva é uma fé viva, que se manifesta inevitavelmente em obras.",
 w:["Tiago e Paulo discordavam, e a igreja escolheu seguir Paulo.",
    "Tiago ensina que as obras, sozinhas, salvam sem necessidade de fé.",
    "Paulo escrevia para judeus e Tiago para gentios, e por isso as regras eram diferentes.",
    "basta dizer que tem fé, mesmo que a vida não mude."],
 r:"Paulo combate quem tenta ser salvo pelas obras; Tiago combate quem diz ter fé mas vive sem mudança. A raiz é a fé, e o fruto são as obras."},

{a:3,d:"D",f:"Filipenses 4.11-13",
 t:"Não digo isto como por necessidade, porque já aprendi a contentar-me com o que tenho. Sei estar abatido e sei também ter abundância; em toda maneira e em todas as coisas, estou instruído, tanto a ter fartura como a ter fome, tanto a ter abundância como a padecer necessidade. Posso todas as coisas naquele que me fortalece.",
 e:"Filipenses 4.13 é muito citado em competições e desafios pessoais. Lido no seu contexto, em que Paulo escrevia preso e agradecia uma oferta da igreja, o versículo significa que",
 c:"Cristo fortalece o crente para permanecer fiel e contente em qualquer circunstância, seja na fartura, seja na necessidade.",
 w:["o cristão sempre vencerá qualquer competição de que participar.",
    "Paulo tinha poderes especiais que o livravam de passar necessidade.",

/* =========================================================
   CADERNOS
   ========================================================= */
const CADERNOS = [
  {n:1, nome:"Azul",    cor:"#1f5fd6", txt:"#fff", seed:1907},
  {n:2, nome:"Amarelo", cor:"#f2c200", txt:"#000", seed:2026},
  {n:3, nome:"Rosa",    cor:"#e2559a", txt:"#fff", seed:4141},
  {n:4, nome:"Branco",  cor:"#ffffff", txt:"#000", seed:7777}
];
const LETRAS = ["A","B","C","D","E"];
const DIF = {F:"fácil",M:"média",D:"difícil"};

function rng(seed){ // mulberry32
  return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
}
function embaralha(arr,r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function maiorSequencia(a){ let m=1,c=1; for(let i=1;i<a.length;i++){c=a[i]===a[i-1]?c+1:1;m=Math.max(m,c);} return m; }

// monta um caderno: ordem embaralhada dentro de cada área e gabarito balanceado (9 de cada letra)
function montaCaderno(cad){
  const r = rng(cad.seed);
  const ordem = [];
  AREAS.forEach((_,ai)=> embaralha(Q.map((q,i)=>i).filter(i=>Q[i].a===ai), r).forEach(i=>ordem.push(i)));
  let pos;
  const base = []; for(let k=0;k<Q.length;k++) base.push(k%5);
  do { pos = embaralha(base, r); } while (maiorSequencia(pos) > 3);
  return ordem.map((qi,k)=>{
    const q = Q[qi], certa = pos[k];
    const erradas = embaralha(q.w, r);
    const alts = []; let e=0;
    for(let l=0;l<5;l++) alts.push(l===certa ? q.c : erradas[e++]);
    return {num:k+1, qi, q, alts, certa};
  });
}
const MONTADOS = CADERNOS.map(montaCaderno);

const $ = s=>document.querySelector(s);
const esc = s=>s; // conteúdo é do próprio banco (pode conter <br>/<b>)
const cfg = ()=>({evento:$("#cfgEvento").value.trim()||"ENEM Bíblico", data:$("#cfgData").value.trim()});

function faixaArea(ai, itens){
  const nums = itens.filter(x=>x.q.a===ai).map(x=>x.num);
  return `Questões ${nums[0]} a ${nums[nums.length-1]}`;
}

      <img src="images/djad/djad-fundo-escuro.png" alt="DJAD Patu">

    </div>
    <div class="faixa-cor" style="border-left:6mm solid ${cad.cor}">
      <div class="num">CADERNO ${cad.n}</div>
      <div class="cor" style="background:${cad.cor};color:${cad.txt}">${cad.nome.toUpperCase()}</div>
    </div>

      <div>
        <h3>Leia atentamente as instruções</h3>
        <ol>
          <li>Este caderno tem <b>45 questões</b> de múltipla escolha, com cinco alternativas cada (A, B, C, D e E) e <b>apenas uma correta</b>.</li>
          <li>Confira se a cor deste caderno (<b>${cad.nome.toUpperCase()}</b>) é a mesma que você marcou no cartão-resposta. Questões marcadas em um caderno de cor diferente serão corrigidas pelo gabarito errado.</li>
          <li>Preencha o círculo da alternativa escolhida com caneta azul ou preta. Questões com mais de uma marcação ou com rasura serão anuladas.</li>
          <li>O tempo de prova é de <b>2 horas</b>, incluindo o preenchimento do cartão-resposta. Você só pode sair depois de <b>30 minutos</b> de prova.</li>
          <li>Durante a prova, não é permitido consultar a Bíblia, o celular, anotações ou outras pessoas.</li>
          <li>Os textos bíblicos citados seguem a versão <b>Almeida Revista e Corrigida (ARC)</b>.</li>
          <li>Ao terminar, entregue o <b>cartão-resposta</b> ao aplicador. Você pode levar este caderno. Use o rascunho da última página para anotar suas respostas.</li>
        </ol>
      </div>
      <div>
        <h3>Áreas da prova</h3>
        <table class="areas-tab">${AREAS.map((a,ai)=>`<tr><td><b>${ai+1}. ${a.nome}</b> — ${a.desc}</td><td>${faixaArea(ai,itens)}</td></tr>`).join("")}</table>
      </div>
      <div class="verso">“Examinais as Escrituras, porque vós cuidais ter nelas a vida eterna, e são elas que de mim testificam.” — João 5.39</div>
    </div>
    <div class="capa-rodape"><span>${c.data||"&nbsp;"}</span><span>Caderno ${cad.n} · ${cad.nome}</span></div>
  </div>`;

  h += `<div class="folha quebra" style="page:cad${cad.n}">
    <div class="cab-cad"><span>${c.evento}</span><span class="marca"><i style="${bola}"></i>Caderno ${cad.n} · ${cad.nome}</span></div>
    <div class="colunas">`;
  let areaAtual = -1;
  itens.forEach(it=>{
    if(it.q.a!==areaAtual){ areaAtual=it.q.a; const A=AREAS[areaAtual];
      h += `<div class="area-tit"><b>Área ${areaAtual+1} · ${A.nome}</b>${A.desc} · ${faixaArea(areaAtual,itens)}</div>`; }
    h += `<div class="q"><div class="qn">QUESTÃO ${String(it.num).padStart(2,"0")}</div>
      ${it.q.t?`<div class="tb">${it.q.t}<cite>${it.q.f} (ARC)</cite></div>`:""}
      <p class="en">${esc(it.q.e)}</p>
      <ol class="alts">${it.alts.map((a,l)=>`<li><span class="l">${LETRAS[l]}</span><span>${a}</span></li>`).join("")}</ol></div>`;
  });
  h += `<div class="fim">FIM DA PROVA · CONFIRA SEU CARTÃO-RESPOSTA</div></div>
    <div class="rasc">
      <h3>Rascunho do gabarito · Caderno ${cad.n} ${cad.nome}</h3>
      <p>Anote suas respostas aqui, recorte e leve para conferir com o gabarito oficial.</p>
      <div class="rasc-grade">${itens.map(it=>`<div>${it.num}</div>`).join("")}</div>

function htmlCartao(){
  const c = cfg();
  const bloco = (ini)=>{ let s='<div class="bloco-resp">';
    for(let n=ini;n<ini+15;n++) s+=`<div class="lin"><span class="n">${String(n).padStart(2,"0")}</span>${LETRAS.map(l=>`<span class="bub">${l}</span>`).join("")}</div>`;
    return s+'</div>'; };
  return `<div class="folha cartao" style="page:cartao">
    <div class="topo"><div><h2>CARTÃO-<b>RESPOSTA</b></h2><small>${c.evento} · DJAD Patu${c.data?" · "+c.data:""}</small></div>
      <img src="images/djad/djad-preto.png" alt="DJAD Patu" style="height:18mm"></div>
    <div class="campos"><div class="campo">Nome completo</div><div class="campo">Congregação</div><div class="campo">Idade</div></div>
    <div class="cad-escolha"><strong>Cor do caderno:</strong>
      ${CADERNOS.map(cd=>`<span><i></i>${cd.n} · ${cd.nome}</span>`).join("")}</div>
    <div class="instr-cartao"><span>Preencha o círculo completamente:</span>
      <span class="ex"><b>Certo</b> <span class="bub on">A</span></span>
      <span class="ex"><b>Errado</b> <span class="bub">✓</span><span class="bub">✕</span></span>
      <span>Marque só uma alternativa por questão. Não rasure.</span></div>
    <div class="grade-resp">${bloco(1)}${bloco(16)}${bloco(31)}</div>
    <div class="ass"><div>Assinatura do participante</div><div class="nota">Acertos (uso do corretor): &nbsp;&nbsp;&nbsp;&nbsp; / 45</div></div>
  </div>`;
}

function htmlGabaritos(){
  const c = cfg();
  let h = `<div class="folha gab" style="page:gab">
    <h2>GABARITO <b>OFICIAL</b></h2>
    <p class="sub">${c.evento}${c.data?" · "+c.data:""}. Confira primeiro a cor do caderno marcada no cartão-resposta.</p>
    <div class="gab-grade">`;
  CADERNOS.forEach((cad,ci)=>{
    const itens = MONTADOS[ci];
    const cont = [0,0,0,0,0]; itens.forEach(it=>cont[it.certa]++);
    h += `<div class="gab-cad"><h4 style="background:${cad.cor};color:${cad.txt}"><i style="background:${cad.cor};border-color:${cad.txt}"></i>${cad.n} · ${cad.nome}</h4>
      <table>${itens.map(it=>`<tr><td>${String(it.num).padStart(2,"0")}</td><td>${LETRAS[it.certa]}</td></tr>`).join("")}</table>
      <div class="dist">${LETRAS.map((l,i)=>`${l}:${cont[i]}`).join(" · ")}</div></div>`;
  });
  h += `</div>`;

  // gabarito comentado — na ordem do banco, com o nº e a letra de cada caderno
  h += `<div class="com"><h2>GABARITO <b>COMENTADO</b></h2>
    <p class="sub">Use na correção coletiva ou na EBD. Cada questão mostra o número e a letra correta em cada caderno.</p>`;
  let areaAtual=-1;
  Q.forEach((q,qi)=>{
    if(q.a!==areaAtual){ areaAtual=q.a; h+=`<div class="com-area">Área ${areaAtual+1} · ${AREAS[areaAtual].nome}</div>`; }
    const map = CADERNOS.map((cad,ci)=>{ const it = MONTADOS[ci].find(x=>x.qi===qi);
      return `<span><i style="background:${cad.cor}"></i>${cad.nome}: <b>${String(it.num).padStart(2,"0")} – ${LETRAS[it.certa]}</b></span>`; }).join("");
    h += `<div class="com-item"><div class="map">${map}</div><div>
      <div class="meta">${q.f}<span class="tag">${DIF[q.d]}</span></div>
      <div class="resp">${q.c}</div><div>${q.r}</div></div></div>`;
  });
  h += `</div></div>`;
  return h;
}

/* páginas nomeadas: cabeçalho e numeração impressos por caderno */
function estilosPagina(){
  const c = cfg();
  let css = "";
  CADERNOS.forEach(cad=>{
    css += `@page cad${cad.n}{ @top-left{content:"${c.evento.replace(/"/g,"'")}";font:600 8pt Inter,sans-serif;color:#666}
      @top-right{content:"CADERNO ${cad.n} · ${cad.nome.toUpperCase()}";font:800 8pt Inter,sans-serif;color:#000}
      @bottom-center{content:"Página " counter(page);font:8pt Inter,sans-serif;color:#666} }
      @page cad${cad.n}:first{ @top-left{content:none} @top-right{content:none} }\n`;
  });
  css += `@page gab{ @bottom-center{content:"Gabarito · página " counter(page);font:8pt Inter,sans-serif;color:#666} }`;
  $("#paginas").textContent = css;
}

const VISTAS = [
  ...CADERNOS.map((cad,ci)=>({id:"cad"+cad.n, rotulo:`Caderno ${cad.n} · ${cad.nome}`, cor:cad.cor, html:()=>htmlCaderno(ci)})),
  {id:"cartao", rotulo:"Cartão-resposta", html:htmlCartao},
  {id:"gab", rotulo:"Gabaritos", html:htmlGabaritos}
];
let atual = "cad1";
function render(){
  estilosPagina();
  $("#folhas").innerHTML = VISTAS.map(v=>`<section class="vista ${v.id===atual?"ativa":""}" id="v-${v.id}">${v.id===atual?v.html():""}</section>`).join("");
  $("#abas").innerHTML = VISTAS.map(v=>`<button aria-pressed="${v.id===atual}" data-v="${v.id}">${v.cor?`<span class="bola" style="background:${v.cor}"></span>`:""}${v.rotulo}</button>`).join("");
  $("#abas").querySelectorAll("button").forEach(b=>b.onclick=()=>{atual=b.dataset.v; salvar(); render(); window.scrollTo(0,0);});
}
function salvar(){ try{ localStorage.setItem("enemBiblico", JSON.stringify({aba:atual, ...cfg()})); }catch(e){} }
try{ const s = JSON.parse(localStorage.getItem("enemBiblico")||"null");
  if(s){ if(s.aba && VISTAS.some(v=>v.id===s.aba)) atual=s.aba; if(s.evento) $("#cfgEvento").value=s.evento; if(s.data) $("#cfgData").value=s.data; } }catch(e){}
{ const h = location.hash.slice(1); if(VISTAS.some(v=>v.id===h)) atual = h; }
["#cfgEvento","#cfgData"].forEach(id=>$(id).addEventListener("input",()=>{salvar(); render();}));
render();
</script>
</body>
</html>
