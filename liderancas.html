<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMADCAMP - Liderança</title>
    <link rel="stylesheet" href="/styles/liderancas.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="top-banner" style="position: relative;">
        <div style="position: absolute; top: 20px; left: 20px;">
            <a href="/umadcamp"
                style="text-decoration: none; color: white; border: 1px solid white; padding: 5px 15px; border-radius: 5px; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.3);">←
                Voltar</a>
        </div>
        <div class="logo">
            <a href="/umadcamp"><img src="/images/logo.png" alt="Logo"></a>
            <h1>Liderança UMADCAMP</h1>
        </div>
    </div>

    <div class="container">
        <div class="main-content">
            <div class="leadership-grid">

                <!-- Pastor do Campo -->
                <div class="leader-card pastor">
                    <img src="/images/lideres/pastor2" alt="Foto Pr. Daniel Faustino" class="leader-photo">
                    <div class="leader-role">Pastor do Campo</div>
                    <div class="leader-name">Pr. Daniel Faustino</div>
                </div>

                <!-- Líderes Gerais -->
                <div class="leader-card">
                    <img src="/images/lideres/jonnas.png" alt="Foto Dc. Jonnas & Miriã" class="leader-photo">
                    <div class="leader-role">Líderes</div>
                    <div class="leader-name">Dc. Jonnas & Miriã</div>
                </div>

                <!-- Vice-Líderes -->
                <div class="leader-card">
                    <img src="/images/lideres/italo2.jpg" alt="Foto Ítalo & Fábia" class="leader-photo">
                    <div class="leader-role">Vice-Líderes</div>
                    <div class="leader-name">Aux. Ítalo & Fábia</div>
                </div>

                <!-- Conselheiros -->
                <div class="leader-card">
                    <img src="/images/lideres/hallyson.jpg" alt="Foto Dc. Hallyson & Daniele" class="leader-photo">
                    <div class="leader-role">Conselheiros</div>
                    <div class="leader-name">Dc. Hallyson & Daniele</div>
                </div>

                <!-- Secretário -->
                <div class="leader-card">
                    <img src="/images/lideres/ravel2.jpg" alt="Foto Aux. Ravel" class="leader-photo">
                    <div class="leader-role">1º Secretário</div>
                    <div class="leader-name">Aux. Ravel</div>
                </div>

                <!-- Tesoureiro -->
                <div class="leader-card">
                    <img src="/images/lideres/felipe2.jpg" alt="Foto Aux. Felipe" class="leader-photo">
                    <div class="leader-role">1º Tesoureiro</div>
                    <div class="leader-name">Aux. Felipe</div>
                </div>

                <!-- Mídia -->
                <div class="leader-card">
                    <img src="/images/lideres/natalia.jpg" alt="Foto Natália" class="leader-photo">
                    <div class="leader-role">Mídia</div>
                    <div class="leader-name">Natália</div>
                </div>

                <div class="leader-card">
                    <img src="/images/lideres/keyllha.jpg" alt="Foto Keyllha" class="leader-photo">
                    <div class="leader-role">Mídia</div>
                    <div class="leader-name">Keyllha</div>
                </div>

                <div class="leader-card">
                    <img src="/images/lideres/estevao.jpg" alt="Foto Estevão" class="leader-photo">
                    <div class="leader-role">Mídia</div>
                    <div class="leader-name">Estevão</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
