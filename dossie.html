<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/cadetes.css">
    <title>Dossiê da Frota</title>
</head>

<body>
    <nav>
        <div class="pixel-font" style="color: white;">CADETES<span style="color: var(--primary-cyan);">A</span>JATO
        </div>
        <div class="nav-links">
            <a href="/cadetes.html">INÍCIO</a>
            <a href="/esquadroes.html">ESQUADRÕES</a>
            <a href="/missoes.html">MISSÕES</a>
        </div>
    </nav>

    <div class="container">

        <!-- NEW HERO SECTION -->
        <div id="dossier-hero" class="dossier-hero">
            <div id="dossier-bg-icon" class="dossier-bg-icon">🦅</div>

            <div class="dossier-content">
                <div id="squad-emblem" class="squad-emblem-large">🦅</div>

                <div class="pixel-font"
                    style="font-size: 0.8rem; color: var(--accent-silver); margin-bottom: 5px; opacity: 0.7;">
                    ARQUIVO CLASS: TOP SECRET
                </div>

                <h1 id="squad-name" class="pixel-font" style="font-size: 1.8rem; margin: 0; text-transform: uppercase;">
                    CARREGANDO...
                </h1>

                <div id="motto"
                    style="font-style: italic; color: var(--gold); margin-top: 10px; font-size: 0.9rem; opacity: 0.9;">
                    "..."
                </div>

                <!-- HUD STATS -->
                <div class="hud-container">
                    <div class="hud-box">
                        <div id="stat-xp" class="hud-value">---</div>
                        <div class="hud-label">XP TOTAL</div>
                    </div>
                    <div class="hud-box">
                        <div id="stat-missions" class="hud-value">---</div>
                        <div class="hud-label">MISSÕES</div>
                    </div>
                    <div class="hud-box">
                        <div id="stat-status" class="hud-value" style="color: var(--xp-color);">---</div>
                        <div class="hud-label">STATUS OP.</div>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="pixel-font"
            style="font-size: 14px; margin-bottom: 20px; border-left: 4px solid var(--primary-cyan); padding-left: 15px;">
            > EFETIVO DO ESQUADRÃO
        </h2>

        <!-- GRID DE MEMBROS DINÂMICO -->
        <div id="members-grid" class="member-grid">
            <!-- Cards inseridos via JS -->
        </div>

        <div style="margin-top: 60px; text-align: center;">
            <a href="/esquadroes.html" class="btn-action"
                style="background:transparent; border: 1px solid var(--accent-silver); color:var(--accent-silver); padding:12px 30px; font-size:12px; border-radius: 4px; text-decoration: none;">
                < VOLTAR PARA FROTAS </a>
        </div>
    </div>

    <!-- SCRIPT DE DADOS E LÓGICA -->
    <script>
        // --- MOCK DATA FOR 4 SQUADS ---
        const SQUAD_DATA = {
            'aguias': {
                name: 'Águias da Aliança',
                motto: 'Voando alto com integridade',
                captain: 'Lucas Gabriel',
                color: '#ffd700', // Gold
                icon: '🛡️',
                stats: { xp: '12.450', missions: '5/5', status: 'EM VOO' },
                members: [
                    { name: 'Lucas Gabriel', role: 'COMMANDER', rank: 'CAPITÃO', badges: ['📖', '🙏', '📢', '🎸', '🛡️'] },
                    { name: 'Mateus Silva', role: 'PILOTO', rank: 'CADETE 1ª CLASSE', badges: ['📖', '🙏', 'locked', 'locked'] },
                    { name: 'Ana Clara', role: 'CO-PILOTO', rank: 'CADETE 2ª CLASSE', badges: ['📖', 'locked', 'locked'] },
                    { name: 'João Pedro', role: 'ARTILHEIRO', rank: 'ASPIRANTE', badges: ['locked', 'locked'] }
                ]
            },
            'falcoes': {
                name: 'Falcões do Rei',
                motto: 'Soberania e autoridade suprema',
                captain: 'Beatriz Costa',
                color: '#ff4b4b', // Red
                icon: '👑',
                stats: { xp: '10.200', missions: '4/5', status: 'ALERTA' },
                members: [
                    { name: 'Beatriz Costa', role: 'COMMANDER', rank: 'CAPITÃO', badges: ['📖', '🙏', '⚔️'] },
                    { name: 'Rafael Souza', role: 'PILOTO', rank: 'CADETE 1ª CLASSE', badges: ['📖', '⚔️', 'locked'] },
                    { name: 'Carla Dias', role: 'ESPECIALISTA', rank: 'CADETE 2ª CLASSE', badges: ['🔧', 'locked'] }
                ]
            },
            'harpias': {
                name: 'Harpias Celestiais',
                motto: 'Força que rompe tempestades',
                captain: 'Gabriela Nunes',
                color: '#a855f7', // Purple
                icon: '⚡',
                stats: { xp: '9.800', missions: '6/5', status: 'ORBITANDO' },
                members: [
                    { name: 'Gabriela Nunes', role: 'COMMANDER', rank: 'CAPITÃO', badges: ['📖', '🙏', '🌪️'] },
                    { name: 'Felipe Melo', role: 'PILOTO', rank: 'CADETE 1ª CLASSE', badges: ['📖', 'locked'] }
                ]
            },
            'condores': {
                name: 'Condores do Reino',
                motto: 'Altitude onde o ar é rarefeito',
                captain: 'Pedro Henrique',
                color: '#00d1ff', // Cyan
                icon: '🏔️',
                stats: { xp: '8.500', missions: '3/5', status: 'SUBINDO' },
                members: [
                    { name: 'Pedro Henrique', role: 'COMMANDER', rank: 'CAPITÃO', badges: ['📖', '🙏', '🪽'] },
                    { name: 'Mariana Lima', role: 'PILOTO', rank: 'CADETE 1ª CLASSE', badges: ['📖', 'locked'] }
                ]
            }
        };

        // --- RENDER FUNCTION ---
        function renderDossier() {
            const params = new URLSearchParams(window.location.search);
            const squadId = params.get('squad');
            const data = SQUAD_DATA[squadId];

            if (!data) {
                document.getElementById('squad-name').innerText = 'DADOS CORROMPIDOS';
                return;
            }

            // 1. Update Header Visuals
            const hero = document.getElementById('dossier-hero');
            const title = document.getElementById('squad-name');
            const motto = document.getElementById('motto');
            const bgIcon = document.getElementById('dossier-bg-icon');
            const emblem = document.getElementById('squad-emblem');

            // Set Data
            title.innerText = data.name;
            title.style.color = data.color;
            title.style.textShadow = `0 0 15px ${data.color}40`; // Soft glow

            motto.innerText = `"${data.motto}"`;
            motto.style.color = data.color;

            emblem.innerText = data.icon;
            emblem.style.filter = `drop-shadow(0 0 20px ${data.color}66)`;

            bgIcon.innerText = data.icon;
            bgIcon.style.color = data.color;

            // Stats
            document.getElementById('stat-xp').innerText = data.stats.xp;
            document.getElementById('stat-missions').innerText = data.stats.missions;
            document.getElementById('stat-status').innerText = data.stats.status;


            // 2. Generate Member Cards (Elite Style)
            const grid = document.getElementById('members-grid');
            grid.innerHTML = ''; // Clear

            data.members.forEach(member => {
                const card = document.createElement('div');
                card.className = 'member-card-elite';

                // Styling customizations based on role
                if (member.role === 'COMMANDER') {
                    card.style.borderLeftColor = data.color;
                    card.style.background = `linear-gradient(135deg, rgba(${hexToRgb(data.color)}, 0.1) 0%, rgba(5, 10, 18, 0.95) 100%)`;
                }

                // Badges Logic
                const badgesHtml = member.badges.map(badge => {
                    const isLocked = badge === 'locked' || badge === '?' || badge === 'lock';
                    const content = isLocked ? '<i class="fas fa-lock" style="font-size:10px"></i>' : badge;
                    const opacity = isLocked ? '0.2' : '1';
                    const title = isLocked ? 'Bloqueado' : 'Conquista';
                    const bg = isLocked ? '#000' : `rgba(${hexToRgb(data.color)}, 0.1)`;
                    const borderColor = isLocked ? '#333' : data.color;

                    return `
                        <div class="badge-item" title="${title}" 
                             style="opacity:${opacity}; background:${bg}; border-color:${borderColor};">
                            ${content}
                        </div>`;
                }).join('');

                card.innerHTML = `
                    <div class="member-header">
                        <div>
                            <div class="pixel-font" style="font-size: 1rem; color: #fff; margin-bottom: 5px;">${member.name}</div>
                            <span class="member-role-badge" style="border-color: ${data.color}44; color: ${data.color};">
                                ${member.rank}
                            </span>
                        </div>
                        <div class="member-avatar" style="border-color: ${member.role === 'COMMANDER' ? data.color : 'rgba(255,255,255,0.1)'}">
                            ${member.role === 'COMMANDER' ? '👑' : '👤'}
                        </div>
                    </div>
                    
                    <div style="font-size: 0.75rem; color: var(--accent-silver); display:flex; justify-content:space-between; align-items:center;">
                        <span>FUNÇÃO: <strong style="color: #fff;">${member.role}</strong></span>
                    </div>

                    <div class="badges-container">
                        ${badgesHtml}
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Helper
        function hexToRgb(hex) {
            hex = hex.replace(/^#/, '');
            let bigint = parseInt(hex, 16);
            let r = (bigint >> 16) & 255;
            let g = (bigint >> 8) & 255;
            let b = bigint & 255;
            return `${r}, ${g}, ${b}`;
        }

        window.onload = renderDossier;
    </script>
</body>

</html>
