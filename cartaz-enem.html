<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>if(location.protocol!=="file:")document.write('<base href="/">')</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cartaz ENEM Bíblico</title>
<link rel="icon" href="images/djad/djad-fundo-escuro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="scripts/fabrica-logos.js"></script>
<style>
:root { --gold: #CAAB5B; --gold-2: #E3C985; --ink: #0c0c0b; --line: #2c2a25; --muted: #9a958a; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #111110; color: #eee; font-family: Inter, system-ui, sans-serif; }

/* ---------- tela ---------- */
.wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
@media (min-width: 900px) { .wrap { grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr); align-items: start; } .preview { position: sticky; top: 16px; } }
h1.top { font: 900 22px Montserrat, sans-serif; margin: 0 0 4px; letter-spacing: .02em; }
h1.top span { color: var(--gold); }
.sub-top { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.seg button, .btn { font: 700 13px Inter, sans-serif; border: 1px solid #3a3730; background: #1a1916; color: #ddd; border-radius: 10px; padding: 10px 8px; cursor: pointer; }
.seg button.on { border-color: var(--gold); background: rgba(202, 171, 91, .16); color: #fff; }
.btn.primary { background: var(--gold); color: #000; border-color: var(--gold); }
.btn:disabled { opacity: .6; cursor: wait; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.actions .btn { flex: 1 1 140px; }
.stage-wrap { position: relative; overflow: hidden; border-radius: 12px; background: #000; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.card { background: #1a1916; border: 1px solid #2c2a25; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.card h2 { margin: 0 0 12px; font: 900 16px Montserrat, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
.field label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input[type=text], input[type=date], textarea { width: 100%; background: #121110; border: 1px solid #34312a; color: #fff; border-radius: 9px; padding: 11px 12px; font: 500 15px Inter, sans-serif; outline: none; color-scheme: dark; }
textarea { resize: vertical; min-height: 70px; }
input:focus, textarea:focus { border-color: var(--gold); }
.hint { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.4; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--gold); width: 18px; height: 18px; }
#capture { position: absolute; left: 0; top: 0; z-index: -1; pointer-events: none; }
#printBox { display: none; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--gold); color: #000; font-weight: 700; padding: 12px 18px; border-radius: 10px; opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }

/* ---------- arte (tamanho real, 1080 de largura) ---------- */
.art { position: relative; width: 1080px; height: 1527px; overflow: hidden; background: var(--ink); color: #f4efe4; font-family: Inter, sans-serif; }
.art.fmt-feed { height: 1350px; }
.art.fmt-story { height: 1920px; }
.art .glow { position: absolute; border-radius: 50%; }
.art .g1 { width: 1400px; height: 1400px; left: -820px; top: -520px; background: radial-gradient(circle, rgba(202, 171, 91, .42) 0%, rgba(202, 171, 91, 0) 62%); }
.art .g2 { width: 1500px; height: 1500px; right: -900px; bottom: -700px; background: radial-gradient(circle, rgba(202, 171, 91, .34) 0%, rgba(202, 171, 91, 0) 62%); }
.art .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(202, 171, 91, .38); }
.art .grain { position: absolute; inset: 0; background-size: 240px 240px; opacity: .08; }

.art .in { position: absolute; left: 0; top: 0; width: 1080px; height: 100%; transform-origin: 0 0; display: flex; flex-direction: column; align-items: center; padding: 70px 86px 56px; text-align: center; }
.art.fmt-feed .in { padding: 56px 80px 44px; }
.art.fmt-story .in { padding: 150px 86px 150px; }
.art .in > * { flex-shrink: 0; }
.art .in > .sp { flex: 1 1 0; min-height: 8px; flex-shrink: 1; }

.art .logo { height: 130px; width: auto; display: block; }
.art.fmt-feed .logo { height: 112px; }
.art .apres { font: 800 22px Montserrat, sans-serif; letter-spacing: .5em; text-transform: uppercase; color: var(--gold); margin-top: 18px; padding-left: .5em; }

.art .head { margin-top: 8px; display: flex; flex-direction: column; align-items: center; }
.art .enem { font: 900 290px/0.86 Montserrat, sans-serif; letter-spacing: -.035em; color: #f6f1e6; margin-right: .035em; }
.art.fmt-feed .enem { font-size: 270px; }
.art .bib { display: flex; align-items: center; gap: 22px; margin-top: 4px; }
.art .bib i { width: 90px; height: 4px; background: var(--gold); }
.art .bib b { font: 900 104px/1 Montserrat, sans-serif; letter-spacing: .14em; color: var(--gold); margin-right: -.14em; }
.art.fmt-feed .bib b { font-size: 86px; }

.art .tag { font: italic 500 44px/1.22 'Playfair Display', serif; color: #efe9dc; margin-top: 24px; }
.art .tag em { font-weight: 700; color: var(--gold-2); }
.art.fmt-feed .tag { font-size: 40px; margin-top: 22px; }

/* linha do cartão-resposta */
.art .bubbles { display: flex; align-items: center; gap: 20px; margin-top: 28px; padding: 14px 28px; border: 2px dashed rgba(202, 171, 91, .55); border-radius: 18px; }
.art .bubbles .n { font: 900 34px Montserrat, sans-serif; font-style: normal; color: var(--muted); margin-right: 6px; }
.art .bubbles span { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #f4efe4; display: flex; align-items: center; justify-content: center; font: 800 28px Montserrat, sans-serif; }
.art .bubbles span.on { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.art.fmt-feed .bubbles { margin-top: 24px; padding: 14px 26px; }
.art.fmt-feed .bubbles span { width: 54px; height: 54px; font-size: 24px; }

.art .stats { display: flex; justify-content: center; gap: 0; margin-top: 32px; width: 100%; }
.art .stat { flex: 1; padding: 0 10px; border-left: 2px solid rgba(202, 171, 91, .35); }
.art .stat:first-child { border-left: 0; }
.art .stat b { display: block; font: 900 74px/1 Montserrat, sans-serif; color: var(--gold); }
.art .stat small { display: block; font: 800 20px Montserrat, sans-serif; letter-spacing: .22em; text-transform: uppercase; margin-top: 10px; color: #e9e3d6; }
.art .dots { display: inline-flex; gap: 9px; margin-top: 12px; }
.art .dots i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .5); }
.art.fmt-feed .stats { margin-top: 28px; }
.art.fmt-feed .stat b { font-size: 62px; }

.art .areas { width: 100%; margin-top: 32px; text-align: left; }
.art .areas h3 { margin: 0 0 12px; font: 800 20px Montserrat, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); text-align: center; }
.art .area { display: flex; align-items: baseline; gap: 22px; padding: 9px 0; border-top: 1px solid rgba(202, 171, 91, .25); }
.art .area:last-child { border-bottom: 1px solid rgba(202, 171, 91, .25); }
.art .area b { flex: none; width: 52px; font: 900 32px Montserrat, sans-serif; color: var(--gold); }
.art .area span { font: 800 30px Montserrat, sans-serif; text-transform: uppercase; letter-spacing: .01em; }
.art .area em { margin-left: auto; font: italic 500 24px 'Playfair Display', serif; color: var(--muted); white-space: nowrap; }
.art.fmt-feed .areas { display: none; }

.art .info { width: 100%; display: flex; align-items: stretch; margin-top: 32px; background: var(--gold); color: var(--ink); border-radius: 18px; overflow: hidden; }
.art .info .d { flex: none; padding: 22px 34px; background: #f4efe4; display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 230px; }
.art .info .d b { font: 900 92px/0.95 Montserrat, sans-serif; }
.art .info .d small { font: 900 26px Montserrat, sans-serif; letter-spacing: .26em; margin-top: 6px; padding-left: .26em; }
.art .info .r { flex: 1; padding: 22px 32px; display: flex; flex-direction: column; justify-content: center; text-align: left; gap: 8px; }
.art .info .r .wd { font: 900 44px/1.05 Montserrat, sans-serif; text-transform: uppercase; }
.art .info .r .loc { font: 700 27px/1.25 Inter, sans-serif; }
.art.fmt-feed .info { margin-top: 30px; }
.art.fmt-feed .info .d b { font-size: 80px; }

.art .insc { margin-top: 20px; font: 800 28px/1.3 Montserrat, sans-serif; letter-spacing: .04em; text-transform: uppercase; }
.art .insc span { color: var(--gold); }
.art .pub { display: inline-block; margin-top: 16px; font: 800 20px Montserrat, sans-serif; letter-spacing: .28em; text-transform: uppercase; color: #e9e3d6; border: 2px solid rgba(202, 171, 91, .6); border-radius: 999px; padding: 10px 24px 10px calc(24px + .28em); }

.art .verse { margin-top: 18px; font: italic 500 26px/1.38 'Playfair Display', serif; color: #d8d2c4; max-width: 860px; }
.art .verse em { color: var(--gold-2); font-weight: 700; }
.art .verse cite { display: block; font: 800 18px Montserrat, sans-serif; font-style: normal; letter-spacing: .26em; text-transform: uppercase; color: var(--gold); margin-top: 10px; }
.art .ftr { width: 100%; display: flex; justify-content: space-between; margin-top: 24px; padding-top: 20px; border-top: 2px solid rgba(202, 171, 91, .3); font: 800 21px Montserrat, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #c9c3b6; }
.art.fmt-feed .verse { display: none; }

@page { size: A4; margin: 0; }
@media print {
  body { background: #fff; }
  body > *:not(#printBox) { display: none !important; }
  #printBox { display: block; }
  #printBox img { display: block; width: 210mm; height: 297mm; }
}
</style>
</head>
<body>
<div class="wrap">
  <section class="preview">
    <div class="seg" id="fmtSeg">
      <button data-fmt="a4">Cartaz A4</button>
      <button data-fmt="feed">Feed 4:5</button>
      <button data-fmt="story">Story</button>
    </div>
    <div class="stage-wrap" id="stageWrap"><div class="stage" id="stage"></div></div>
    <div class="actions">
      <button class="btn primary" id="btnPng">Baixar PNG</button>
      <button class="btn" id="btnPrint">🖨 Imprimir A4</button>
    </div>
  </section>

  <section>
    <h1 class="top">Cartaz <span>ENEM Bíblico</span></h1>
    <p class="sub-top">DJAD Patu · preencha os dados e baixe ou imprima</p>
    <div class="card">
      <h2>Quando e onde</h2>
      <div class="row2">
        <div class="field"><label>Data</label><input type="date" data-k="data"></div>
        <div class="field"><label>Horário</label><input type="text" data-k="hora" placeholder="19h"></div>
      </div>
      <div class="field"><label>Local</label><input type="text" data-k="local"></div>
      <div class="field">
        <label>Inscrições (opcional)</label>
        <input type="text" data-k="insc" placeholder="Ex.: Inscrições com a liderança da DJAD até 25/11">
        <div class="hint">Deixe vazio para não mostrar.</div>
      </div>
      <div class="field">
        <label>Números da prova</label>
        <div class="row2" style="grid-template-columns:1fr 2fr;margin-bottom:6px"><input type="text" data-k="n1"><input type="text" data-k="l1"></div>
        <div class="row2" style="grid-template-columns:1fr 2fr;margin-bottom:6px"><input type="text" data-k="n2"><input type="text" data-k="l2"></div>
        <div class="row2" style="grid-template-columns:1fr 2fr"><input type="text" data-k="n3"><input type="text" data-k="l3"></div>
        <div class="hint">Número + texto. Deixe o número vazio para esconder aquele item. Se escrever “Cadernos”, aparecem as bolinhas coloridas.</div>
      </div>
      <div class="field"><label>Público</label><input type="text" data-k="publico"></div>
    </div>
    <div class="card">
      <h2>Textos</h2>
      <div class="field"><label>Frase</label><textarea data-k="frase" rows="2"></textarea><div class="hint">Use <code>*palavra*</code> para dourar.</div></div>
      <div class="field"><label class="check"><input type="checkbox" data-k="areas"> Mostrar as 5 áreas da prova (A4 e story)</label></div>
      <div class="field"><label class="check"><input type="checkbox" data-k="versiculo"> Mostrar 2 Timóteo 2.15</label></div>
      <div class="row2">
        <div class="field"><label>Rodapé (esquerda)</label><input type="text" data-k="ftrL"></div>
        <div class="field"><label>Rodapé (direita)</label><input type="text" data-k="ftrR"></div>
      </div>
      <div class="field"><button class="btn" id="btnReset">Restaurar textos padrão</button></div>
    </div>
  </section>
</div>
<div id="capture"></div>
<div id="printBox"></div>
<div class="toast" id="toast"></div>

<script>
const FMT = { a4: { w: 1080, h: 1527 }, feed: { w: 1080, h: 1350 }, story: { w: 1080, h: 1920 } };
const SEMANA = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
const MES_C = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
const AREAS = [
  ['Pentateuco e Históricos', 'Gênesis a Ester'],
  ['Poéticos e Proféticos', 'Jó a Malaquias'],
  ['Evangelhos e Atos', 'Mateus a Atos'],
  ['Epístolas e Apocalipse', 'Romanos a Apocalipse'],
  ['Doutrina e Vida Cristã', 'Fundamentos da fé']
];
const LOGO = (window.FABRICA_LOGOS && window.FABRICA_LOGOS.djad_escuro) || 'images/djad/djad-fundo-escuro.png';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hl = s => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
function pd(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }

function defaults() {
  return {
    fmt: 'a4', data: '', hora: '19h', local: 'Templo Sede · AD Patu/RN', insc: '',
    publico: 'Para jovens e adultos',
    frase: 'Você conhece a Palavra?\nChegou a hora de *provar*.',
    n1: '5', l1: 'Áreas', n2: '2h', l2: 'De prova', n3: '4', l3: 'Cadernos',
    areas: true, versiculo: true, ftrL: '@djadpatu', ftrR: 'AD Patu · Templo Sede'
  };
}
let S = defaults();
try { Object.assign(S, JSON.parse(localStorage.getItem('cartaz-enem') || '{}')); } catch (e) { }
const save = () => { try { localStorage.setItem('cartaz-enem', JSON.stringify(S)); } catch (e) { } };

const GRAIN = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 240;
  const x = c.getContext('2d'), img = x.createImageData(240, 240);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  x.putImageData(img, 0, 0); return c.toDataURL('image/png');
})();

function rings(cx, cy, n, r0, step) {
  return Array.from({ length: n }, (_, i) => { const r = r0 + i * step; return `<div class="ring" style="width:${2 * r}px;height:${2 * r}px;left:${cx - r}px;top:${cy - r}px"></div>`; }).join('');
}

function build(fmt) {
  const F = FMT[fmt], d = pd(S.data);
  const el = document.createElement('div');
  el.className = 'art fmt-' + fmt;
  const dia = d ? String(d.getDate()).padStart(2, '0') : '--';
  const mes = d ? MES_C[d.getMonth()] : 'DATA';
  const wd = d ? SEMANA[d.getDay()] : 'Em breve';
  const wdLine = wd + (S.hora ? ` · ${S.hora}` : '');
  const stats = [[S.n1, S.l1], [S.n2, S.l2], [S.n3, S.l3]].filter(([n]) => String(n || '').trim());
  el.innerHTML = `
    <div class="glow g1"></div><div class="glow g2"></div>
    ${rings(-40, F.h * 0.2, 10, 120, 26)}${rings(1120, F.h * 0.62, 11, 130, 26)}
    <div class="grain" style="background-image:url('${GRAIN}')"></div>
    <div class="in">
      <img class="logo" src="${LOGO}" alt="DJAD">
      <div class="apres">apresenta</div>
      <div class="sp"></div>
      <div class="head"><div class="enem">ENEM</div><div class="bib"><i></i><b>BÍBLICO</b><i></i></div></div>
      ${S.frase ? `<div class="tag">${hl(S.frase)}</div>` : ''}
      <div class="bubbles"><em class="n">01</em><span>A</span><span>B</span><span class="on">C</span><span>D</span><span>E</span></div>
      ${stats.length ? `<div class="stats">${stats.map(([n, l]) => `<div class="stat"><b>${esc(n)}</b><small>${esc(l)}</small>
        ${/caderno/i.test(l) ? '<div class="dots"><i style="background:#1f5fd6"></i><i style="background:#f2c200"></i><i style="background:#e2559a"></i><i style="background:#fff"></i></div>' : ''}</div>`).join('')}</div>` : ''}
      ${S.areas ? `<div class="areas"><h3>O que cai na prova</h3>${AREAS.map((a, i) => `<div class="area"><b>0${i + 1}</b><span>${a[0]}</span><em>${a[1]}</em></div>`).join('')}</div>` : ''}
      <div class="sp"></div>
      <div class="info">
        <div class="d"><b>${dia}</b><small>${mes}</small></div>
        <div class="r"><div class="wd">${esc(wdLine)}</div>${S.local ? `<div class="loc">${esc(S.local)}</div>` : ''}</div>
      </div>
      ${S.insc ? `<div class="insc">${hl(S.insc).replace(/<em>/g, '<span>').replace(/<\/em>/g, '</span>')}</div>` : ''}
      ${S.publico ? `<div class="pub">${esc(S.publico)}</div>` : ''}
      <div class="sp"></div>
      ${S.versiculo ? `<div class="verse">“Procura apresentar-te a Deus <em>aprovado</em>, como obreiro que não tem de que se envergonhar, que maneja bem a palavra da verdade.”<cite>2 Timóteo 2.15</cite></div>` : ''}
      ${(S.ftrL || S.ftrR) ? `<div class="ftr"><span>${esc(S.ftrL)}</span><span>${esc(S.ftrR)}</span></div>` : ''}
    </div>`;
  return el;
}

// Se não couber, encolhe o bloco inteiro até caber
// (escala com transform, que o html2canvas também entende)
function fit(el) {
  const inn = el.querySelector('.in'), H = el.clientHeight;
  let z = 1;
  inn.style.height = H + 'px';
  while (inn.scrollHeight > inn.clientHeight + 1 && z > 0.7) {
    z -= 0.02;
    Object.assign(inn.style, { width: 1080 / z + 'px', height: H / z + 'px', transform: `scale(${z})` });
  }
}

let raf = 0;
function render() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const el = build(S.fmt);
    $('#stage').replaceChildren(el);
    fit(el);
    layout();
    save();
  });
}
function layout() {
  const F = FMT[S.fmt], wrap = $('#stageWrap');
  const maxW = wrap.clientWidth, maxH = innerWidth >= 900 ? innerHeight - 110 : innerHeight * 0.75;
  const sc = Math.min(maxW / F.w, maxH / F.h);
  $('#stage').style.transform = `scale(${sc})`;
  $('#stage').style.left = ((maxW - F.w * sc) / 2) + 'px';
  wrap.style.height = (F.h * sc) + 'px';
}

function sync() {
  $$('[data-k]').forEach(i => { if (i.type === 'checkbox') i.checked = !!S[i.dataset.k]; else i.value = S[i.dataset.k] ?? ''; });
  $$('#fmtSeg button').forEach(b => b.classList.toggle('on', b.dataset.fmt === S.fmt));
}
document.addEventListener('input', e => { const k = e.target.dataset?.k; if (!k) return; S[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; render(); });
$$('#fmtSeg button').forEach(b => b.onclick = () => { S.fmt = b.dataset.fmt; sync(); render(); });
$('#btnReset').onclick = () => { if (!confirm('Voltar os textos para o padrão?')) return; const keep = { fmt: S.fmt, data: S.data, hora: S.hora, local: S.local, insc: S.insc }; S = Object.assign(defaults(), keep); sync(); render(); };
addEventListener('resize', layout);

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

let fontsReady;
const fonts = () => fontsReady ||= Promise.all(['900 100px Montserrat', '800 40px Montserrat', '700 30px Inter', 'italic 500 40px "Playfair Display"', 'italic 700 40px "Playfair Display"'].map(f => document.fonts.load(f))).then(() => document.fonts.ready);

async function capture(fmt, scale) {
  await fonts();
  const F = FMT[fmt], el = build(fmt);
  $('#capture').replaceChildren(el);
  await Promise.all([...el.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  fit(el);
  const sx = scrollX, sy = scrollY; scrollTo(0, 0);
  try { return await html2canvas(el, { width: F.w, height: F.h, scale, backgroundColor: '#0c0c0b', useCORS: true, logging: false, scrollX: 0, scrollY: 0 }); }
  finally { scrollTo(sx, sy); $('#capture').replaceChildren(); }
}
async function busy(btn, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'Gerando…';
  try { await fn(); } catch (e) { console.error(e); toast(e.name === 'SecurityError' ? 'Abra a página pelo site para baixar.' : 'Erro ao gerar: ' + (e.message || e)); }
  finally { btn.disabled = false; btn.textContent = old; }
}
$('#btnPng').onclick = e => busy(e.currentTarget, async () => {
  const c = await capture(S.fmt, S.fmt === 'a4' ? 2 : 1);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `cartaz-enem-biblico-${S.fmt}.png`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Cartaz baixado!');
});
$('#btnPrint').onclick = e => busy(e.currentTarget, async () => {
  const c = await capture('a4', 3);
  const img = new Image(); img.src = c.toDataURL('image/png');
  await img.decode();
  $('#printBox').replaceChildren(img);
  window.print();
});

sync(); render(); fonts().then(render);
</script>
